<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karácsonyi Túlélőközpont</title>
<meta name="theme-color" content="#dcecf8">
<meta name="description" content="Mariahrmageddon, Whamageddon, Feliznavidageddon – kiesésbejelentő és statisztika a Kecskeméti Fiatalok Társaságától.">
<link rel="manifest" href="manifest_v5.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Túlélőközpont">
<style>
:root{--bg:#eef6fc;--card:#fff;--line:#d3e5f3;--txt:#16324f;--mut:#6b86a0;--red:#d7263d;--grn:#2a9d6f;--ice:#8cc3ea;--blue:#2c6fa8;--warn:#d97706;--navh:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(180deg,#dcecf8 0,var(--bg) 380px,#f8fbfe 100%) fixed;color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;background:rgba(238,246,252,.9);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
header b{font-size:1rem;letter-spacing:.2px}
main{max-width:640px;margin:0 auto;padding:8px 16px calc(var(--navh) + 36px + env(safe-area-inset-bottom));position:relative;z-index:2}
h1{font-size:1.45rem;margin:.1em 0;text-align:center;letter-spacing:.4px}
h2{font-size:1.1rem;margin:1.4em 0 .5em}
h3{font-size:1rem;margin:.2em 0 .4em}
p{margin:.5em 0}
.sub{color:var(--mut);margin:0 0 .6em;text-align:center}
.hero{text-align:center;padding:8px 0 0}
.hero svg{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.hero .count{font-size:1.05rem;font-weight:600;margin:6px 0 2px}
button,.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.pri,.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.fb,.btn.fb{background:#1877f2;border-color:#1877f2;color:#fff;font-weight:600}
button.on{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:600}
button.warn{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
button.sm,.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:9px}
button.wide{width:100%}
button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 6px 18px -12px rgba(22,50,79,.25)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.alive{background:#dff4ea;color:var(--grn)}
.dead{background:#fde2e5;color:var(--red)}
.soon{background:#e6eff7;color:var(--mut)}
.locked{background:#e2e8f0;color:#475569}
.mut{color:var(--mut);font-size:.9rem}
input,select,textarea{width:100%;background:#f7fbff;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px}
label{font-size:.9rem;color:var(--mut)}
.chk{display:flex;gap:8px;align-items:center;color:var(--txt);margin:6px 0}
.chk input{width:auto;margin:0}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
.hide{display:none!important}

/* csempék */
.tiles{display:grid;gap:12px;margin:12px 0}
.tile{position:relative;text-align:left;width:100%;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:0 10px 24px -16px rgba(22,50,79,.45);display:flex;gap:14px;align-items:center;overflow:hidden;border-left:7px solid var(--accent,var(--ice))}
.tile:active{transform:scale(.99)}
.tile .ico{font-size:2.1rem;line-height:1;flex:none}
.tile .t{flex:1;min-width:0}
.tile .t b{display:block;font-size:1.12rem}
.tile .t span{display:block;color:var(--mut);font-size:.88rem}
.tile.out{background:#fbf3f4;border-left-color:var(--red)}
.tile.dim{opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{flex-direction:column;align-items:flex-start;text-align:left;border-left:1px solid var(--line);border-top:5px solid var(--ice);min-height:108px;padding:14px}
.mini.lock{opacity:.6}

/* alsó menü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mut);max-width:110px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.act{color:var(--red);font-weight:700}
nav button.plus .pl{width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -4px rgba(215,38,61,.6)}
nav button.plus svg{stroke:#fff;width:26px;height:26px;stroke-width:2.4}

/* sheet / oldal */
.modal{position:fixed;inset:0;background:rgba(22,50,79,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;overflow:auto}
.modal>div{background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grip{width:42px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 12px}
.page{position:fixed;inset:0;z-index:9;background:linear-gradient(180deg,#dcecf8 0,var(--bg) 300px,#f8fbfe 100%);overflow:auto}
.page .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;background:rgba(238,246,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:2}
.page .pb{max-width:640px;margin:0 auto;padding:8px 16px calc(40px + env(safe-area-inset-bottom))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border-radius:99px;padding:7px 13px;font-size:.92rem}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:#f8fbfe;font-size:.88rem;color:var(--txt);margin:0 6px 6px 0}
.pill input{width:auto;margin:0}
.notice{border-left:4px solid var(--ice);background:#f3f9fe;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.93rem}
.notice.red{border-color:var(--red);background:#fff4f5}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.steps li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
ol.rules{padding-left:1.2em;margin:.3em 0}
ol.rules li{margin:.55em 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin:8px 0}
details summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"＋";float:right;color:var(--mut)}
details[open] summary:after{content:"－"}
details p{margin:0 0 12px}
.seg{display:flex;gap:6px;background:#e3eef8;border-radius:12px;padding:4px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px}
.seg button.sel{background:#fff;font-weight:700;box-shadow:0 1px 4px rgba(22,50,79,.15)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.mode-card{text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px;background:#f8fbfe;display:flex;flex-direction:column;gap:4px}
.mode-card span{font-size:.8rem;color:var(--mut)}
.mode-card.active{border-color:var(--red);background:#fff5f5}
.yt-thumb{width:96px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}

/* statisztika */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .card{text-align:center;margin:0;padding:12px 6px}
.num{font-size:1.6rem;font-weight:800}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9rem}
.bar span.l{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:12px;background:linear-gradient(90deg,var(--ice),#4a9ad4);border-radius:6px;min-width:2px}
.bar em{font-style:normal;color:var(--mut)}
.feed>div{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}

/* térkép, játék */
#map{height:calc(100vh - 360px);min-height:300px;border-radius:16px;border:1px solid var(--line);overflow:hidden;z-index:1}
#gc{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:#dcecf8;touch-action:none;display:block}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.ctl button{font-size:1.5rem;padding:14px 0;user-select:none;-webkit-user-select:none;touch-action:none}

/* dalok */
.play{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.play.go{background:#eaf5fd;border-color:var(--ice)}
.play.off{background:#f3f6f9;color:#9fb0c0;cursor:not-allowed;text-decoration:line-through;text-decoration-color:var(--red)}
.play svg{width:20px;height:20px}

/* hó, olvadás */
#snow{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.flake{position:absolute;top:-10px;background:#fff;border-radius:50%;opacity:.85;box-shadow:0 0 4px rgba(140,195,234,.7);animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0)}}
.drip{animation:drip 2.6s ease-in infinite;opacity:0}
@keyframes drip{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}85%{opacity:.9}100%{opacity:0;transform:translateY(var(--d))}}
@media (prefers-reduced-motion:reduce){.flake,.drip{animation:none}.flake{display:none}.modal>div{animation:none}}

/* egységes irányító gombok + arcade ranglista */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 8px}
.pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 8px}
.gbtn{height:60px;border-radius:18px;background:linear-gradient(180deg,#fff,#e9f3fb);border:1px solid var(--line);box-shadow:0 3px 0 #c5dbed;color:var(--blue);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
.gbtn:active{transform:translateY(3px);box-shadow:0 0 0 #c5dbed}
.gbtn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gbtn small{font-size:.72rem;font-weight:600}
.gbtn.lockd{opacity:.35}
.arcade{background:#101a2c;color:#ffd166;border-radius:14px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;margin-bottom:10px}
.arcade .ah{text-align:center;color:#8cc3ea;letter-spacing:2px;margin-bottom:6px}
.arcade .ar{display:grid;grid-template-columns:2.2em 1fr auto 1.6em;gap:8px;padding:2px 0}
.arcade .ar.me{color:#fff;background:rgba(255,255,255,.08);border-radius:6px}
.arcade .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

  const drips=p>0&&p<1?[0.2,0.55,0.8].map((f,i)=>{const cx=x1+w*f,cy=iceTop+14,dist=245-cy;
    return `<ellipse class="drip" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="2.2" ry="3.4" fill="#7fb9e6" style="--d:${dist.toFixed(0)}px;animation-delay:${i*0.9}s"/>`}).join(""):"";
  const cracks=p>0.45?`<path d="M${x1+w*0.3} ${iceTop+8} l8 22 l-6 14 l9 20" stroke="#fff" stroke-width="1.4" fill="none" opacity=".85"/><path d="M${x1+w*0.7} ${iceTop+6} l-7 18 l5 16" stroke="#fff" stroke-width="1.2" fill="none" opacity=".8"/>`:"";
  return `<svg viewBox="0 0 220 270" role="img" aria-label="Mariah olvad a jégtömbből"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f5ff"/><stop offset="1" stop-color="#8cc3ea"/></linearGradient></defs>
  <ellipse cx="110" cy="247" rx="${puddle.toFixed(1)}" ry="${(5+p*9).toFixed(1)}" fill="#a9d6f3" opacity=".85"/>
  <ellipse cx="110" cy="247" rx="${(puddle*0.6).toFixed(1)}" ry="${(3+p*5).toFixed(1)}" fill="#cfe9fa" opacity=".9"/>
  <g><path d="M82 66 C70 92 74 122 82 142 L138 142 C146 122 150 92 138 66 C130 42 90 42 82 66Z" fill="#d1a85f"/>
  <path d="M92 98 L128 98 L142 192 L78 192Z" fill="#d7263d"/><ellipse cx="110" cy="98" rx="23" ry="6" fill="#fff"/>
  <rect x="84" y="142" width="52" height="8" fill="#1d2b3a"/><rect x="106" y="141" width="8" height="10" fill="none" stroke="#e9c46a" stroke-width="1.6"/>
  <path d="M92 104 L74 144 M128 104 L146 144" stroke="#f1cfb3" stroke-width="7" stroke-linecap="round"/>
  <circle cx="74" cy="146" r="5" fill="#fff"/><circle cx="146" cy="146" r="5" fill="#fff"/>
  <rect x="97" y="192" width="8" height="38" fill="#f1cfb3"/><rect x="115" y="192" width="8" height="38" fill="#f1cfb3"/>
  <rect x="94" y="226" width="14" height="14" rx="3" fill="#fff"/><rect x="112" y="226" width="14" height="14" rx="3" fill="#fff"/>
  <circle cx="110" cy="74" r="18" fill="#f1cfb3"/><path d="M102 74 q3 2 6 0 M112 74 q3 2 6 0" stroke="#6b3f2a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M104 82 q6 5 12 0" stroke="#c4554f" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M90 62 Q110 24 134 52 L130 62 Q110 52 92 66Z" fill="#d7263d"/><path d="M91 62 Q110 54 131 61" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="134" cy="50" r="6" fill="#fff"/></g>
  <g><rect x="${x1.toFixed(1)}" y="${iceTop.toFixed(1)}" width="${w.toFixed(1)}" height="${(247-iceTop).toFixed(1)}" rx="12" fill="url(#ig)" opacity="${iceOp}" stroke="#fff" stroke-width="2"/>
  <path d="M${(x1+10).toFixed(1)} ${(iceTop+10).toFixed(1)} l0 ${Math.max(10,(247-iceTop)*0.4).toFixed(1)}" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>${cracks}${drips}</g></svg>`;
}
function treeSvg(daysPassed,daysLeft,skulls){
  const pts=[[110,66,"#e5484d"],[96,90,"#fbbf24"],[124,92,"#3b82f6"],[86,118,"#3fb27f"],[112,115,"#e5484d"],[136,120,"#fbbf24"],[75,150,"#3b82f6"],[99,147,"#e5484d"],[123,148,"#fbbf24"],[147,152,"#3fb27f"],[66,184,"#fbbf24"],[92,182,"#3b82f6"],[116,185,"#e5484d"],[140,181,"#fbbf24"],[158,186,"#3b82f6"],[82,204,"#3fb27f"],[110,205,"#fbbf24"],[134,204,"#e5484d"]];
  const lit=Math.round(clamp(daysPassed,0,24)/24*pts.length);
  const bulbs=pts.map(([x,y,c],i)=>i<lit?`<circle cx="${x}" cy="${y}" r="8" fill="${c}" opacity=".28"/><circle cx="${x}" cy="${y}" r="5" fill="${c}" stroke="#fff" stroke-width="1.2"/>`:`<circle cx="${x}" cy="${y}" r="4.5" fill="#9bb5c9" opacity=".45"/>`).join("");
  return `<svg viewBox="0 0 220 260" role="img" aria-label="Karácsonyfa visszaszámláló"><circle cx="110" cy="130" r="95" fill="#d9eefc" opacity=".6"/><rect x="97" y="210" width="26" height="32" rx="4" fill="#6b4423"/>
  <polygon points="110,28 70,84 150,84" fill="#1b5e3a"/><polygon points="110,60 56,128 164,128" fill="#1e6f43"/><polygon points="110,96 42,172 178,172" fill="#237e4d"/><polygon points="110,132 30,214 190,214" fill="#268b55"/>
  <polygon points="110,8 115,20 128,20 117,27 121,39 110,32 99,39 103,27 92,20 105,20" fill="#f59e0b" stroke="#fff" stroke-width="1.2"/>${bulbs}
  <rect x="30" y="226" width="160" height="28" rx="14" fill="#16324f"/><text x="110" y="244" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${daysLeft>0?`Még ${daysLeft} nap karácsonyig`:"Boldog karácsonyt!"}</text>
  ${skulls?`<text x="195" y="34" text-anchor="end" font-size="14">${"💀".repeat(skulls)}</text>`:""}</svg>`;
}

let db; try{ db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }catch(e){ db=getFirestore(app); }

let user=null, userDoc=null, userLoaded=false, myPart=null, mineReady=false, isAdmin=false, statsPublic=false, onboardFor=null;
let elims=[], subs=[], rem=null, remLoaded=false, TEAMS=null, teamsLoading=false;

/* Olvasáscsökkentés: a konfig és a pillanatképek (térkép, statisztika) 1-1 dokumentum, helyben gyorsítótárazva */
async function cachedDoc(name,ttl){
  const k="snap_"+name+YEAR, c=ls.get(k,null);
  if(c&&Date.now()-c.t<ttl) return c.d;
  try{ const s=await getDoc(doc(db,"config",name)); const d=s.exists()?s.data():null; ls.set(k,{t:Date.now(),d}); return d; }
  catch(e){ return c?c.d:null; }
}
async function loadConfig(){ const c=await cachedDoc("public",5*60e3); statsPublic=!!(c&&c.statsPublic); render(); }
loadConfig();
const pendingTeamParam=new URLSearchParams(location.search).get("team");
if(pendingTeamParam&&/^[A-Za-z0-9]{6}$/.test(pendingTeamParam)) ls.set("pendingTeam",pendingTeamParam.toUpperCase());

function subscribe(){
  subs.forEach(f=>f()); subs=[]; elims=[]; mineReady=false; myPart=null;
  if(!user) return;
  /* csak a saját dokumentumaink élő figyelése – néhány olvasás, nem az egész gyűjtemény */
  subs.push(onSnapshot(doc(db,"participations",`${YEAR}_${user.uid}`),s=>{myPart=s.exists()?{id:s.id,...s.data()}:null;mineReady=true;render();maybeOnboard();if(myPart){touchRem();checkPendingTeam()}},e=>{console.error(e);mineReady=true;render()}));
  subs.push(onSnapshot(query(collection(db,"eliminations"),where("uid","==",user.uid),where("year","==",YEAR)),s=>{elims=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e)));
}
function maybeOnboard(){
  if(user&&userLoaded&&mineReady&&(!userDoc||!myPart)&&onboardFor!==user.uid){ onboardFor=user.uid; onboarding(); }
}
onAuthStateChanged(auth, async u=>{
  user=u; userDoc=null; isAdmin=false; userLoaded=false; onboardFor=null; rem=null; remLoaded=false; TEAMS=null; AD.loaded=false;
  if(u){
    try{
      const s=await getDoc(doc(db,"users",u.uid)); userDoc=s.exists()?s.data():null;
      isAdmin=(await getDoc(doc(db,"admins",u.uid))).exists();
    }catch(e){console.error(e)}
  }
  userLoaded=true;
  if(firstAuth){ firstAuth=false; if(u&&phase()==="during") route="game"; }
  subscribe(); render(); maybeOnboard(); if(u) loadRem();
});

const myElim = k => elims.find(e=>e.uid===user?.uid && e.challenge===k);
const joinedOf = k => !!myPart && (myPart.challenges||[]).includes(k);
const unlocked = k => !!myPart && (k==="mariah"||myPart.mode==="diehard"||!!myElim(PREV[k]));
const myElims = () => elims.filter(e=>e.uid===user?.uid);
const isAlive = () => !myPart ? true : (myPart.mode==="diehard" ? !KEYS.every(k=>myElim(k)) : !myElim("feliz"));

/* ---------- „Élsz még?” e-mail emlékeztető (a küldést a worker végzi) ---------- */
async function loadRem(){
  try{ const s=await getDoc(doc(db,"reminders",user.uid)); rem=s.exists()?s.data():null; }catch(e){}
  remLoaded=true; touchRem();
}
async function setReminder(on){
  if(!user||!user.email) throw new Error("Nincs e-mail-cím a fiókhoz.");
  await setDoc(doc(db,"reminders",user.uid),{email:user.email,optIn:on,alive:isAlive(),lastSeen:serverTimestamp(),year:YEAR});
  rem={email:user.email,optIn:on}; ls.set("remSeen",Date.now());
}
async function touchRem(force){
  if(!user||!rem||!rem.optIn||!myPart) return;
  if(!force&&Date.now()-ls.get("remSeen",0)<12*3600e3) return;
  try{ await updateDoc(doc(db,"reminders",user.uid),{lastSeen:serverTimestamp(),alive:isAlive()}); ls.set("remSeen",Date.now()); }catch(e){}
}

/* ---------- Admin: adatok kézi/éves betöltése (nem élő figyelés – ezzel spórolunk az olvasásokon) ---------- */
async function loadAdminData(force){
  if(!isAdmin||AD.loading) return;
  if(AD.loaded&&!force&&Date.now()-AD.t<5*60e3) return;
  AD.loading=true;
  try{
    const Y=where("year","==",YEAR);
    const [a,b,c,d]=await Promise.all([getDocs(query(collection(db,"participations"),Y)),getDocs(query(collection(db,"eliminations"),Y)),getDocs(query(collection(db,"dangerZones"),Y)),getDocs(collection(db,"users"))]);
    AD.parts=a.docs.map(x=>({id:x.id,...x.data()})); AD.elims=b.docs.map(x=>({id:x.id,...x.data()}));
    AD.dangers=c.docs.map(x=>({id:x.id,...x.data()})); AD.users=d.docs.map(x=>({id:x.id,...x.data()}));
    AD.loaded=true; AD.t=Date.now();
  }catch(e){console.error(e)}
  AD.loading=false;
  render();
  await maybeAutoPublish();
}
async function maybeAutoPublish(){
  if(!isAdmin||!AD.loaded) return;
  try{ const s=await getDoc(doc(db,"config","mapSnapshot")); const t=s.exists()?(s.data().t||0):0; if(Date.now()-t>30*60e3) await publishSnapshots(); }catch(e){console.error(e)}
}

/* ---------- Kezdőlap ---------- */

    hero=treeSvg(Math.ceil((n-b.start)/DAY),Math.max(0,Math.ceil((b.end-n)/DAY)),myElims().length);

  v.innerHTML=`<div class="hero">${hero}<h1>Christmas Survival Center</h1><p class="count">${line}</p><p class="sub">Három dal. Három front. Egyetlen cél: túlélni.</p></div>${stat}
  <div style="margin:10px 0">${cta}</div>${badgeHtml()}<div id="vbanner"></div><div id="inst"></div>
  <div class="card"><h3>Mi ez?</h3><p>A Kecskeméti Fiatalok Társaságának karácsonyi túlélőjátéka. December 1-jétől karácsony éjfélig próbáld elkerülni, hogy meghallgasd – <b>felismerd</b> – a három legismertebb karácsonyi dalt. Aki felismeri, kiesik, és ezt a telefonjáról egy koppintással jelentheti.</p>
  <p class="mut">${YEAR}-ben összesen ${total} évnyi karácsonyi zenei terror vár rád (${ages.join(" + ")} év).</p></div>
  <div class="card"><h3>A három front</h3>${KEYS.map(k=>`<div class="row" style="margin:8px 0"><span>${CH[k].ico} <b>${CH[k].name}</b></span><span class="mut">${CH[k].artist}: ${CH[k].song} (${YEAR-CH[k].rel} éves)</span></div>`).join("")}</div>
  <div class="card"><h3>Két játékmód</h3>
    <p><b>🎄 Hagyományos (vígaszági):</b> a Mariahrmageddonnal indulsz. Ha kiestél, a Whamageddon következik, ha abból is, akkor a Feliznavidageddon.</p>
    <p><b>🔥 Die Hard:</b> mindhárom fronton egyszerre indulsz.</p></div>
  <div class="card"><h3>Hogyan működik?</h3>
    <ol class="steps"><li><div><b>Regisztrálj</b> becenévvel, és válassz játékmódot.</div></li>
    <li><div><b>Kerüld a dalokat</b> – boltban, rádióban, vásárban, mindenhol.</div></li>
    <li><div><b>Ha kiestél:</b> nyisd meg az appot, koppints a dal csempéjére, add meg a helyet és a körülményt – kész. Utána megoszthatod Facebookon is.</div></li></ol></div>
  <p class="mut" style="text-align:center"><a href="#" id="h-rules" style="color:var(--blue)">Szabályok és GYIK →</a></p>`;

function badgeHtml(){

/* ---------- Játék (csempék) ---------- */
function viewGame(v){
  const ph=phase(); let head;
  if(!user) head=`<div class="card"><b>Csatlakozz a túlélőkhöz!</b><p class="mut">Lépj be, válassz becenevet és játékmódot, és ha kiestél, egy koppintással jelentheted.</p><button class="pri" id="g-in">Belépés / regisztráció</button></div>`;
  else if(!myPart) head=mineReady?`<div class="card"><b>Add meg a ${YEAR}. évi beállításaidat</b><p><button class="pri sm" id="g-onb">Megnyitás</button></p></div>`:`<p class="mut">Betöltés…</p>`;
  else head=`<div class="row" style="margin:.4em 0"><span>Szia, <b>${esc(userDoc?.nick||myPart.nick)}</b>!</span><span class="tag alive">${myPart.mode==="diehard"?"🔥 Die Hard":"🎄 Hagyományos"}</span></div>`;
  const hint = ph==="during" ? `Ha kiestél, koppints a dal csempéjére.` : ph==="before" ? `A bejelentés december 1-jétől lehetséges.` : `A játék véget ért.`;
  v.innerHTML=`${head}<h2 style="margin-top:.6em">Kihívások</h2><p class="mut" style="margin-top:-6px">${hint}</p><div class="tiles">${KEYS.map(tileHtml).join("")}</div>`+
    (myPart&&myPart.mode==="classic"?`<p class="mut">Hagyományos módban a következő front akkor nyílik meg, ha az előzőből kiestél.</p>`:"");
  $("#g-in")?.addEventListener("click",loginModal);
  $("#g-onb")?.addEventListener("click",onboarding);
  v.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>tileTap(b.dataset.tile));
}
function tileHtml(k){
  const c=CH[k], ph=phase(), e=myElim(k), j=joinedOf(k);
  let badge,sub,cls="";
  if(e){badge=`<span class="tag dead">KIESETT</span>`;sub=`${fmt(e.occurredAt)} · ${esc(e.settlement)}`;cls="out"}
  else if(!user){badge=`<span class="tag soon">Belépés</span>`;sub="Koppints a csatlakozáshoz"}
  else if(!myPart){badge=`<span class="tag soon">Beállítás</span>`;sub="Előbb válassz játékmódot"}
  else if(!j){
    if(unlocked(k)){badge=`<span class="tag soon">Csatlakozás</span>`;sub="Koppints a csatlakozáshoz"}
    else {badge=`<span class="tag locked">🔒 Zárva</span>`;sub=`Vígaszág: ${CH[PREV[k]].short} után nyílik`;cls="dim"}
  }
  else if(ph==="before"){badge=`<span class="tag soon">Dec. 1.</span>`;sub="Hamarosan indul"}
  else if(ph==="after"){badge=`<span class="tag alive">TÚLÉLTED 🎉</span>`;sub="Gratulálunk!"}
  else {const d=Math.floor((nowDate()-bounds().start)/DAY)+1;badge=`<span class="tag alive">TÚLÉLŐ</span>`;sub=`${d}. nap · koppints, ha kiestél`}
  return `<button class="tile ${cls}" style="--accent:${c.accent}" data-tile="${k}"><span class="ico">${c.ico}</span><span class="t"><b>${c.name}</b><span>${esc(sub)}</span></span>${badge}</button>`;
}
function tileTap(k){
  if(!user) return loginModal();
  if(!myPart) return onboarding();
  if(myElim(k)) return detailModal(k);
  if(!joinedOf(k)) return unlocked(k)?joinModal(k):lockedModal(k);
  if(canReport()) return reportSheet(k);
  infoModal(k);

let showElim=true, showDanger=true;

const stamp=t=>new Date(t).toLocaleString("hu-HU",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletP) return leafletP;

function destroyMap(){ if(mapObj){mapObj.remove();mapObj=null;elimLayer=dangerLayer=null} }
async function loadMapSnap(){

let fitted=false;
function refreshMarkers(fit){
  if(!mapObj||!elimLayer) return;
  elimLayer.clearLayers(); dangerLayer.clearLayers();
  const pts=[];
  if(showElim&&MS){
    (MS.cells||[]).forEach(o=>{
      const by={}; KEYS.forEach(k=>{ if((mapFilter==="all"||mapFilter===k)&&o[CK[k]]) by[k]=o[CK[k]]; });
      const n=Object.values(by).reduce((a,x)=>a+x,0); if(!n) return;
      const col=Object.keys(by).length>1?"#d7263d":CH[Object.keys(by)[0]].accent;
      const m=L.circleMarker([o.lat,o.lng],{radius:7+Math.min(20,Math.sqrt(n)*5),color:"#fff",weight:2,fillColor:col,fillOpacity:.8});
      m.bindPopup(`<b>${esc(o.n)}</b><br>${n} kiesés<br>`+Object.entries(by).map(([k,c])=>`${CH[k].ico} ${CH[k].short}: ${c}`).join("<br>"));
      m.addTo(elimLayer); pts.push([o.lat,o.lng]);
    });
  }
  if(showDanger&&MS){
    (MS.dz||[]).filter(d=>mapFilter==="all"||(d.sg||[]).includes(mapFilter)).forEach(d=>{
      const col=d.r==="extreme"?"#b91c1c":"#d97706";
      const icon=L.divIcon({className:"",html:`<div style="background:${col};color:#fff;border:2px solid #fff;border-radius:99px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.35)">!</div>`,iconSize:[24,24],iconAnchor:[12,12]});
      const songs=(d.sg||[]).map(x=>CH[x]?.short).filter(Boolean).join(", ");
      L.marker([d.lat,d.lng],{icon}).bindPopup(`<b>⚠️ ${esc(d.p)}</b> (${esc(d.s)})<br><small>${esc(d.c)} · ${esc(songs)}${d.r==="extreme"?" · extrém zóna":""}</small>${d.note?`<p style="margin:4px 0 0;font-size:12px">„${esc(d.note)}”</p>`:""}`).addTo(dangerLayer);
    });
  }
  if((fit||!fitted)&&pts.length){ fitted=true; if(pts.length===1) mapObj.setView(pts[0],9); else mapObj.fitBounds(pts,{padding:[30,30],maxZoom:10}); }
}

async function deleteAccount(){
  if(!confirm("Biztosan törlöd a fiókodat és az összes adatodat? Ez nem vonható vissza."))return;
  if(Date.now()-Date.parse(user.metadata.lastSignInTime)>4*60e3){alert("Biztonsági okból lépj ki, jelentkezz be újra, és a belépés után rögtön próbáld újra a törlést.");return}
  try{
    try{ await loadTeams(true); for(const t of TEAMS||[]) await leaveTeam(t,true); }catch(e){console.error(e)}
    for(const c of ["eliminations","participations","dangerZones"]){
      const sn=await getDocs(query(collection(db,c),where("uid","==",user.uid)));
      for(const d of sn.docs) await deleteDoc(doc(db,c,d.id));
    }
    for(const y of YEARS){ try{ await deleteDoc(doc(db,"games",String(y),"scores",user.uid)); }catch(e){} }
    try{ await deleteDoc(doc(db,"reminders",user.uid)); }catch(e){}
    if(userDoc?.nickKey) await deleteDoc(doc(db,"nicknames",userDoc.nickKey));
    await deleteDoc(doc(db,"users",user.uid));
    await deleteUser(user);
    closePage(); alert("A fiókod és az adataid törölve.");
  }catch(e){alert("A törlés nem sikerült: "+msg(e))}
}

const nameOf = uid => AD.users.find(u=>u.id===uid)?.nick || AD.parts.find(p=>p.uid===uid)?.nick || "Játékos";
const topN=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([l,c])=>({l,n:c}));
function summarize(){
  const per={mariah:{j:0,o:0},wham:{j:0,o:0},feliz:{j:0,o:0}}, city={}, circ={}, daily=new Array(72).fill(0), elimOf={};
  AD.elims.forEach(e=>{
    (elimOf[e.uid]??=new Set()).add(e.challenge); if(per[e.challenge]) per[e.challenge].o++;
    const c=(e.settlement||"?").trim(); city[c]=(city[c]||0)+1; circ[e.circumstance]=(circ[e.circumstance]||0)+1;
    const d=e.occurredAt?.toDate?.(); if(d&&d.getMonth()===11){const i=d.getDate()-1; const k=KEYS.indexOf(e.challenge); if(i>=0&&i<24&&k>=0) daily[i*3+k]++;}
  });
  AD.parts.forEach(p=>(p.challenges||[]).forEach(k=>per[k]&&per[k].j++));
  const active=AD.parts.filter(p=>(elimOf[p.uid]?.size||0)<(p.challenges?.length||1)).length;
  const dh=AD.parts.filter(p=>p.mode==="diehard"&&!(elimOf[p.uid]?.size));
  return {year:YEAR,t:Date.now(),players:AD.parts.length,active,elims:AD.elims.length,
    classic:AD.parts.filter(p=>p.mode!=="diehard").length,diehard:AD.parts.filter(p=>p.mode==="diehard").length,
    multi:Object.values(elimOf).filter(x=>x.size>=2).length,per,city:topN(city,15),circ:topN(circ,10),daily,dhAlive:dh.length,_elimOf:elimOf,_dh:dh};
}
function buildMapSnap(){
  const g={};
  AD.elims.forEach(e=>{
    const c=(e.lat!=null&&e.lng!=null)?{lat:e.lat,lng:e.lng}:cityCoords(e.settlement); if(!c) return;
    const o=(g[c.lat+","+c.lng]??={n:e.settlement,lat:c.lat,lng:c.lng,m:0,w:0,f:0}); o[CK[e.challenge]]++;
  });
  const dz=[];
  AD.dangers.filter(d=>d.approved).forEach(d=>{
    const c=cityCoords(d.settlement); if(!c) return;
    let h=0; for(const ch of d.place) h=(h*31+ch.charCodeAt(0))|0; h=Math.abs(h);
    dz.push({p:d.place,s:d.settlement,c:d.category,sg:d.songs,r:d.riskLevel,note:d.note||"",lat:c.lat+((h%7)-3)*0.004,lng:c.lng+(((h>>3)%7)-3)*0.006});
  });
  return {year:YEAR,t:Date.now(),cells:Object.values(g),dz};
}

const bars=arr=>{ if(!arr||!arr.length) return `<div class="mut">Még nincs adat.</div>`; const m=arr[0].n; return arr.map(({l,n})=>`<div class="bar"><span class="l">${esc(l)}</span><i style="width:${Math.max(2,n/m*45)}%"></i><em>${n}</em></div>`).join(""); };
function dailyChart(daily){
  const tot=i=>daily[i*3]+daily[i*3+1]+daily[i*3+2];
  const max=Math.max(1,...Array.from({length:24},(_,i)=>tot(i))), bw=480/24, H=105;
  let svg=`<svg viewBox="0 0 480 140" style="width:100%" role="img" aria-label="Napi kiesések decemberben"><line x1="0" y1="120" x2="480" y2="120" stroke="#d3e5f3"/>`;
  for(let i=0;i<24;i++){ let y=120; KEYS.forEach((k,j)=>{const h=daily[i*3+j]/max*H; if(h>0){y-=h; svg+=`<rect x="${(i*bw+2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${CH[k].accent}"/>`}});
    if(i%3===0||i===23) svg+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="134" font-size="9" text-anchor="middle" fill="#6b86a0">${i+1}.</text>`; }
  return svg+`</svg><div class="legend">${KEYS.map(k=>`<span><i style="background:${CH[k].accent}"></i>${CH[k].short}</span>`).join("")}<span>(december napjai)</span></div>`;
}

/* Kiesés bejelentése */
const dist=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos((a+c)/2*r);return Math.sqrt(x*x+y*y)*6371};
function reportSheet(k,existing){
  const e=existing||{}; let gps=null, circ=e.circumstance||"", custom=!!existing;
  modal(`<div class="grip"></div><h3 style="margin:0 0 4px">${CH[k].ico} ${existing?"Bejelentés szerkesztése":"Kiestem!"}</h3>
  <p class="mut" style="margin:0 0 8px">${CH[k].name}${existing?"":" · a kiesés véglegesen rögzül"}</p>
  <label>Mikor?</label><div id="whenbox"></div>
  <label>Hol? (település)</label>
  <div class="row" style="flex-wrap:nowrap;gap:8px"><input id="city" list="cl" style="margin:4px 0 10px" value="${esc(e.settlement||ls.get("lastCity","Kecskemét"))}"><button id="loc" style="margin-bottom:6px;white-space:nowrap">📍 Helyem</button></div>
  <datalist id="cl">${Object.keys(CITY).map(c=>`<option>${c}</option>`).join("")}</datalist>
  <div class="mut" id="lochint" style="margin:-6px 0 8px"></div>
  <label>Körülmény</label>
  <div class="chips" id="circ">${CIRC.map(c=>`<button class="chip ${c===circ?"sel":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <label>Pontos helyszín (opcionális, pl. főtér)</label><input id="place" maxlength="80" value="${esc(e.place||"")}">
  <label>Hogyan történt a tragédia? (opcionális)</label><textarea id="story" rows="2" maxlength="350">${esc(e.story||"")}</textarea>
  <div class="err" id="er"></div>
  <button class="pri wide" id="ok">${existing?"Mentés":"Véglegesítem"}</button><button class="wide" style="margin-top:8px" id="x">Mégse</button>`);
  const wb=$("#whenbox");
  const drawWhen=()=>{ wb.innerHTML = custom
    ? `<input id="when" type="datetime-local" value="${localInput(e.occurredAt?e.occurredAt.toDate():nowDate())}">`
    : `<div class="row" style="margin:4px 0 10px"><b>Most (${nowDate().toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"})})</b><button class="sm" id="other">Máskor történt</button></div>`;
    $("#other")?.addEventListener("click",()=>{custom=true;drawWhen()}); };
  drawWhen();
  $("#x").onclick=closeModal;
  $("#circ").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{circ=b.dataset.c;$("#circ").querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b))});
  $("#city").addEventListener("input",()=>{gps=null;$("#lochint").textContent=""});
  $("#loc").onclick=()=>{
    const h=$("#lochint"); h.textContent="Helymeghatározás…";
    if(!navigator.geolocation){h.textContent="A böngésző nem támogatja a helymeghatározást – írd be a települést.";return}
    navigator.geolocation.getCurrentPosition(p=>{
      const lat=+p.coords.latitude.toFixed(2), lng=+p.coords.longitude.toFixed(2);
      let best=null,bd=1e9; for(const [n,[a,b]] of Object.entries(CITY)){const d=dist(lat,lng,a,b);if(d<bd){bd=d;best=n}}
      gps={lat,lng};
      if(bd<=15){$("#city").value=best;h.textContent=`Hely rögzítve (kb. 1 km pontosan) – ${best}.`}
      else{$("#city").value="";h.textContent="Hely rögzítve (kb. 1 km pontosan). Írd be a település nevét is.";$("#city").focus()}
    },()=>{h.textContent="Nem sikerült a helymeghatározás – írd be a települést."},{timeout:8000,maximumAge:60000});
  };
  $("#ok").onclick=async()=>{
    const er=$("#er"); er.textContent="";
    const city=$("#city").value.trim(), b=bounds();
    let when=nowDate();
    if(custom){when=new Date($("#when").value); if(isNaN(when)) return er.textContent="Add meg az időpontot."}
    if(when>new Date(nowDate().getTime()+60000)) return er.textContent="Jövőbeli időpont nem lehet.";
    if(when<b.start) return er.textContent="A játék december 1-jén kezdődik, korábbi időpont nem lehet.";
    if(when>=b.end) return er.textContent="A játék december 24-én éjfélkor véget ér, későbbi időpont nem lehet.";
    if(!city) return er.textContent="A település kötelező.";
    if(!circ) return er.textContent="Válaszd ki a körülményt.";
    const c=gps||cityCoords(city);
    const data={settlement:city,place:$("#place").value.trim(),circumstance:circ,story:$("#story").value.trim(),occurredAt:Timestamp.fromDate(when)};
    if(c){data.lat=c.lat;data.lng=c.lng}
    try{
      const ref=doc(db,"eliminations",`${user.uid}_${k}_${YEAR}`);
      if(existing){ await updateDoc(ref,data); closeModal(); return; }
      await setDoc(ref,{...data,uid:user.uid,challenge:k,year:YEAR,reportedAt:serverTimestamp()});
      ls.set("lastCity",city);
      let opened=null;
      if(myPart.mode==="classic"&&NEXT[k]&&!joinedOf(NEXT[k])){
        try{ await updateDoc(doc(db,"participations",myPart.id),{challenges:[...new Set([...(myPart.challenges||[]),NEXT[k]])]}); opened=NEXT[k]; }catch(err){console.error(err)}
      }
      setTimeout(()=>doneSheet(k,data,opened),150); setTimeout(afterElim,900);
    }catch(err){er.textContent=msg(err)}
  };
}

/* Képeslap (PNG) */
function drawPostcard(cv,k,e){
  const ctx=cv.getContext("2d"), W=1080, H=1350, c=CH[k], occ=e.occurredAt.toDate();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#1f1218"); g.addColorStop(1,"#121826"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,0.2)"; for(let i=0;i<60;i++){ctx.beginPath();ctx.arc((i*193)%W,(i*271)%H,2+(i%5),0,Math.PI*2);ctx.fill()}
  ctx.strokeStyle="rgba(239,68,68,.65)"; ctx.lineWidth=6; ctx.strokeRect(48,48,W-96,H-96);
  ctx.textAlign="center"; ctx.fillStyle="#cbd5e1"; ctx.font="700 32px system-ui,sans-serif"; ctx.fillText(`CHRISTMAS SURVIVAL CENTER ${YEAR}`,W/2,130);
  ctx.fillStyle="#94a3b8"; ctx.font="500 26px system-ui,sans-serif"; ctx.fillText(myPart?.mode==="diehard"?"DIE HARD MÓD":"HAGYOMÁNYOS MÓD",W/2,178);
  ctx.font="100px system-ui,sans-serif"; ctx.fillText("💀",W/2,360);
  ctx.fillStyle="#fca5a5"; ctx.font="800 58px system-ui,sans-serif"; ctx.fillText("ELESETT A HARCBAN",W/2,510);
  ctx.fillStyle="#fff"; ctx.font="800 52px system-ui,sans-serif"; ctx.fillText(userDoc?.nick&&myPart?.publicProfile!==false?userDoc.nick:"Rejtőzködő túlélő",W/2,600);
  ctx.fillStyle=c.accent; ctx.font="700 44px system-ui,sans-serif"; ctx.fillText(c.name.toUpperCase(),W/2,695);
  ctx.fillStyle="#e2e8f0"; ctx.font="500 30px system-ui,sans-serif"; ctx.fillText(`„${c.artist}: ${c.song}”`,W/2,750);
  ctx.fillStyle="rgba(255,255,255,0.08)"; ctx.fillRect(100,815,W-200,240);
  ctx.fillStyle="#fff"; ctx.font="600 30px system-ui,sans-serif";
  ctx.fillText(`📅 ${occ.toLocaleString("hu-HU",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}`,W/2,885);
  ctx.fillText(`📍 ${e.settlement}${e.place?" – "+e.place:""}`,W/2,945);
  ctx.fillStyle="#cbd5e1"; ctx.fillText(`🎧 ${e.circumstance}`,W/2,1005);
  ctx.fillStyle="#94a3b8"; ctx.font="700 30px system-ui,sans-serif"; ctx.fillText(c.tag,W/2,1130);
  ctx.fillStyle="#64748b"; ctx.font="500 26px system-ui,sans-serif"; ctx.fillText("Kecskeméti Fiatalok Társasága · "+FB_PAGE_SHOW,W/2,1230);
  ctx.fillStyle="#475569"; ctx.font="500 22px system-ui,sans-serif"; ctx.fillText(APP_URL.replace(/^https?:\/\//,"").slice(0,60),W/2,1275);
}

/* ---------- Jelvények ---------- */
const TIERS=[["Kiscserkész","🏕️"],["Profi túlélő","🛡️"],["Zenei Rambo","🎖️"],["Neo","🕶️"],["Karácsonyi legenda","👑"]];
function finalOutMs(){
  if(!myPart) return null; const o={}; myElims().forEach(e=>o[e.challenge]=e.occurredAt.toDate().getTime());
  if(myPart.mode==="diehard") return KEYS.every(k=>o[k])?Math.max(...KEYS.map(k=>o[k])):null;
  return o.feliz||null;
}
function survDays(){
  if(!myPart) return 0; const b=bounds(); const j=myPart.joinedAt?.toDate?.().getTime()||0;
  const start=Math.max(j,b.start.getTime()), end=Math.min(finalOutMs()||Infinity,b.end.getTime(),nowDate().getTime());
  return Math.max(0,(end-start)/DAY);
}
function tierInfo(){ const d=survDays(), i=Math.min(4,Math.floor(d/5)); return {i,d,left:Math.max(1,Math.ceil(5*(i+1)-d))}; }

const ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>ALPH[b%ALPH.length]).join("");
const myEntry=()=>({nick:myPart.nick,mode:myPart.mode,outs:Object.fromEntries(myElims().map(e=>[e.challenge,e.occurredAt.toDate().getTime()]))});
const sameEntry=(a,b)=>!!a&&a.nick===b.nick&&a.mode===b.mode&&JSON.stringify(Object.entries(a.outs||{}).sort())===JSON.stringify(Object.entries(b.outs||{}).sort());
async function loadTeams(force){
  if(!user||!myPart||teamsLoading) return; if(TEAMS&&!force) return;
  teamsLoading=true;
  try{ const sn=await getDocs(query(collection(db,"teams"),where("memberIds","array-contains",user.uid))); TEAMS=sn.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.year===YEAR); }
  catch(e){ console.error(e); TEAMS=TEAMS||[]; }
  teamsLoading=false; await syncMyTeamEntries(); render();
}
async function syncMyTeamEntries(){
  if(!myPart||!user) return; const mine=myEntry();
  for(const t of TEAMS||[]){
    if(sameEntry(t.members?.[user.uid],mine)) continue;
    try{ await updateDoc(doc(db,"teams",t.id),{[`members.${user.uid}`]:mine}); (t.members??={})[user.uid]=mine; }catch(e){console.error(e)}
  }
}
async function createTeam(name){
  const code=newCode();
  await setDoc(doc(db,"teams",code),{name,year:YEAR,owner:user.uid,memberIds:[user.uid],members:{[user.uid]:myEntry()},createdAt:serverTimestamp()});
  await loadTeams(true); return code;
}
async function joinTeam(code){
  const ref=doc(db,"teams",code.toUpperCase()), sn=await getDoc(ref);
  if(!sn.exists()) throw new Error("Nincs ilyen csapat.");
  const t=sn.data(); if(t.year!==YEAR) throw new Error("Ez a csapat másik évre szól.");
  if((t.memberIds||[]).includes(user.uid)) return;
  if((t.memberIds||[]).length>=12) throw new Error("A csapat megtelt (legfeljebb 12 fő).");
  await updateDoc(ref,{memberIds:[...t.memberIds,user.uid],[`members.${user.uid}`]:myEntry()});
  await loadTeams(true);
}
async function leaveTeam(t,silent){
  if(!silent&&!confirm(`Kilépsz a(z) „${t.name}” csapatból?`)) return;
  await updateDoc(doc(db,"teams",t.id),{memberIds:(t.memberIds||[]).filter(x=>x!==user.uid),[`members.${user.uid}`]:deleteField()});
  if(!silent) await loadTeams(true);
}

function memberStat(m){
  const o=m.outs||{}, b=bounds();
  const all=m.mode==="diehard"?(KEYS.every(k=>o[k])?Math.max(...KEYS.map(k=>o[k])):null):(o.feliz||null);
  const end=all||Math.min(nowDate().getTime(),b.end.getTime());
  return {alive:!all,days:Math.max(0,(end-b.start.getTime())/DAY),outsN:Object.keys(o).length};
}
function teamCard(t){
  const rows=Object.entries(t.members||{}).map(([uid,m])=>({uid,m,st:memberStat(m)}))
    .sort((a,c)=>a.st.alive!==c.st.alive?(a.st.alive?-1:1):a.st.alive?(a.st.outsN-c.st.outsN):(c.st.days-a.st.days));
  return `<div class="card"><div class="row"><b>${esc(t.name)}</b><span class="mut">kód: <b>${esc(t.id)}</b></span></div>
  <div class="feed">${rows.map((r,i)=>`<div class="row"><div>${i+1}. <b>${esc(r.m.nick)}</b>${r.uid===user.uid?" (te)":""}<div class="mut">${r.st.days.toFixed(1).replace(".",",")} nap · ${r.st.alive?"még bent":"kiesett"}</div></div><div>${KEYS.map(k=>`<span class="tag ${r.m.outs?.[k]?"dead":"alive"}" title="${CH[k].name}">${CH[k].short.charAt(0)}${r.m.outs?.[k]?" ✕":" ✓"}</span>`).join(" ")}</div></div>`).join("")}</div>
  <div class="row" style="margin-top:10px"><button class="sm pri" data-invite="${esc(t.id)}">📤 Meghívó</button><button class="sm" data-leave="${esc(t.id)}">Kilépés</button></div></div>`;
}

 left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>', right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',

function startGame(cv,tier,practice){
  stopGame();
  const T=practice?4:tier, ctx=cv.getContext("2d"), W=360, H=240, GY=196;
  const P={x:60,y:GY,vy:0,crouch:false,jumps:0,inv:0}, K={l:false,r:false,d:false};
  const fresh=()=>({t:0,waves:[],notes:[],gifts:[],spawn:1.2,giftT:9+Math.random()*6,over:false,won:false,shield:T>=4?1:0,slow:0,fast:0,freeze:0,dashCd:0,freezeCd:0,mouth:0,msg:"",msgT:0,fin:0});
  let S=fresh();
  const day=()=>S.t/60, say=m=>{S.msg=m;S.msgT=2};
  const best=()=>ls.get("bestd"+YEAR,0);
  const bestEl=()=>{const e=$("#gbest");if(e)e.textContent=best()?`Saját rekord: ${best().toFixed(2).replace(".",",")} nap`:""};
  bestEl();
  $("#ba")?.classList.toggle("lockd",T<2); $("#bf")?.classList.toggle("lockd",T<3);
  const reset=()=>{ S=fresh(); P.x=60;P.y=GY;P.vy=0;P.crouch=false;P.jumps=0;P.inv=0; };
  const jump=()=>{ if(S.over){ if(S.fin>0.4) reset(); return }
    if(P.y>=GY-0.5&&!P.crouch){P.vy=-440;P.jumps=1} else if(T>=1&&P.jumps<2&&P.y<GY-0.5){P.vy=-400;P.jumps=2} };
  const dash=()=>{ if(S.over||T<2||S.dashCd>0) return; P.inv=0.5; S.dashCd=6; say("⚡ Kitörés!") };
  const freeze=()=>{ if(S.over||T<3||S.freezeCd>0) return; S.freeze=2; S.freezeCd=14; say("🕶️ Megállítottad a hangokat!") };
  const finish=won=>{ if(S.over) return; S.over=true; S.won=won; S.fin=0;
    const d=Math.round(Math.min(24,day())*100)/100;
    if(d>best()){ ls.set("bestd"+YEAR,d); bestEl(); if(!practice) saveScore(d,T); } };
  const spawnWave=d=>{
    const mk=(type,dx)=>S.waves.push(type==="low"?{x:W-40+dx,y:GY-26,w:30,h:26,type}:{x:W-40+dx,y:GY-58,w:30,h:26,type});
    const r=Math.random(); mk(Math.random()<0.5?"low":"high",0);
    if(d>6&&r<0.25) mk(Math.random()<0.5?"low":"high",95);
    if(d>14&&r<0.12) mk("low",190);
  };
  const gift=()=>{ const r=Math.random();
    if(r<0.3){S.shield=Math.min(2,S.shield+1);say("🛡️ Pajzs!")}
    else if(r<0.55){S.slow=6;say("🐌 Lassítás 6 mp-re")}
    else if(r<0.8){S.t+=30;say("🎅 Fél nap ajándékba!")}
    else {S.fast=5;say("🔔 Csengőszó: gyorsulás!")} };
  G={};
  G.kd=e=>{ const k=e.key; if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(k)) e.preventDefault();
    if(k==="ArrowLeft"||k==="a"||k==="A")K.l=true; if(k==="ArrowRight"||k==="d"||k==="D")K.r=true;
    if(k==="ArrowDown"||k==="s"||k==="S")K.d=true;
    if((k==="ArrowUp"||k==="w"||k==="W"||k===" ")&&!e.repeat)jump();
    if((k==="e"||k==="E")&&!e.repeat)dash(); if((k==="q"||k==="Q")&&!e.repeat)freeze(); };
  G.ku=e=>{ const k=e.key; if(k==="ArrowLeft"||k==="a"||k==="A")K.l=false; if(k==="ArrowRight"||k==="d"||k==="D")K.r=false; if(k==="ArrowDown"||k==="s"||k==="S")K.d=false; };
  addEventListener("keydown",G.kd); addEventListener("keyup",G.ku);
  const hold=(id,fn)=>{ const el=$(id); if(!el) return; const on=e=>{e.preventDefault();fn(true)}, off=e=>{e.preventDefault();fn(false)};
    el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off); el.addEventListener("pointerleave",off); el.addEventListener("pointercancel",off); };
  hold("#bl",v=>K.l=v); hold("#br",v=>K.r=v); hold("#bd",v=>K.d=v);
  $("#bu")?.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
  $("#ba")?.addEventListener("pointerdown",e=>{e.preventDefault();dash()});
  $("#bf")?.addEventListener("pointerdown",e=>{e.preventDefault();freeze()});
  cv.addEventListener("pointerdown",()=>{ if(S.over&&S.fin>0.4) reset(); });
  const hit=w=>{ const ph=P.crouch?24:44, px=P.x+3, pw=16, py=P.y-ph+3, pH=ph-6; return px<w.x+w.w-3&&px+pw>w.x+3&&py<w.y+w.h-3&&py+pH>w.y+3; };
  let last=performance.now();
  function step(now){
    const dt=Math.min(0.04,(now-last)/1000); last=now;
    if(!S.over){
      S.t+=dt; const d=day(); if(d>=24) finish(true);
      P.crouch=K.d&&P.y>=GY-0.5;
      if(K.l)P.x-=140*dt; if(K.r)P.x+=140*dt; P.x=clamp(P.x,10,150);
      P.vy+=1300*dt; P.y+=P.vy*dt; if(P.y>=GY){P.y=GY;P.vy=0;P.jumps=0}
      S.dashCd=Math.max(0,S.dashCd-dt); S.freezeCd=Math.max(0,S.freezeCd-dt); P.inv=Math.max(0,P.inv-dt);
      S.slow=Math.max(0,S.slow-dt); S.fast=Math.max(0,S.fast-dt); S.freeze=Math.max(0,S.freeze-dt); S.msgT=Math.max(0,S.msgT-dt);
      let speed=(150+d*9)*(1+T*0.04); if(S.slow>0)speed*=0.6; if(S.fast>0)speed*=1.35; if(S.freeze>0)speed=0;
      if(S.freeze<=0) S.spawn-=dt;
      if(S.spawn<=0){ spawnWave(d); S.spawn=Math.max(0.5,1.7-d*0.045-T*0.03)+Math.random()*0.6; S.mouth=0.35; }
      S.mouth=Math.max(0,S.mouth-dt);
      S.giftT-=dt; if(S.giftT<=0){ S.gifts.push({x:W-30,y:Math.random()<0.5?GY-22:GY-72,w:20,h:20}); S.giftT=10+Math.random()*10; }
      S.waves.forEach(w=>w.x-=speed*dt); S.waves=S.waves.filter(w=>w.x>-50);
      S.gifts.forEach(g=>g.x-=speed*dt); S.gifts=S.gifts.filter(g=>g.x>-30);
      const ph=P.crouch?24:44; S.gifts=S.gifts.filter(g=>{ if(P.x+3<g.x+g.w&&P.x+19>g.x&&P.y-ph<g.y+g.h&&P.y>g.y){ gift(); return false } return true; });
      if(Math.random()<dt*2) S.notes.push({x:W-30,y:60+Math.random()*60,v:20+Math.random()*30});
      S.notes.forEach(n=>{n.y-=n.v*dt;n.x+=6*dt}); S.notes=S.notes.filter(n=>n.y>10);
      if(P.inv<=0){ const hw=S.waves.find(hit); if(hw){ if(S.shield>0){ S.shield--; S.waves=S.waves.filter(w=>w!==hw); say("🛡️ A pajzs megvédett!"); } else finish(false); } }
    } else S.fin+=dt;
    // rajz
    const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#cfe6f7"); sky.addColorStop(1,"#f4faff"); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff"; ctx.fillRect(0,GY,W,H-GY); ctx.fillStyle="#bcd9ee"; ctx.fillRect(0,GY,W,2);
    ctx.fillStyle="rgba(140,195,234,.55)"; for(let i=0;i<14;i++){ctx.beginPath();ctx.arc((i*97+S.t*20)%W,(i*53)%GY,1.6,0,6.3);ctx.fill()}
    S.notes.forEach(n=>{ctx.fillStyle="rgba(215,38,61,.55)";ctx.font="14px sans-serif";ctx.fillText("♪",n.x,n.y)});
    drawMariah(ctx,318,GY,S.mouth>0);
    S.waves.forEach(w=>drawWave(ctx,w));
    S.gifts.forEach(g=>{ ctx.font="20px sans-serif"; ctx.textAlign="left"; ctx.fillText("🎁",g.x,g.y+18); });
    if(P.inv>0) ctx.globalAlpha=.5;
    drawHero(ctx,P); ctx.globalAlpha=1;
    if(S.shield>0){ ctx.strokeStyle="rgba(44,111,168,.8)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(P.x+11,P.y-(P.crouch?12:22),26,0,6.3); ctx.stroke(); }
    if(S.freeze>0){ ctx.fillStyle="rgba(120,180,255,.22)"; ctx.fillRect(0,0,W,H); }
    const dd=Math.min(24,day());
    ctx.fillStyle="#16324f"; ctx.font="700 13px system-ui,sans-serif"; ctx.textAlign="left"; ctx.fillText(`Nap ${dd.toFixed(1).replace(".",",")} / 24`,10,18);
    ctx.fillStyle="rgba(22,50,79,.15)"; ctx.fillRect(10,24,150,5); ctx.fillStyle="#d7263d"; ctx.fillRect(10,24,150*dd/24,5);
    ctx.font="12px system-ui,sans-serif"; ctx.textAlign="right";
    ctx.fillText(`${S.shield>0?"🛡️×"+S.shield+"  ":""}${T>=2?(S.dashCd>0?"⚡"+Math.ceil(S.dashCd):"⚡ kész"):""}  ${T>=3?(S.freezeCd>0?"⏱"+Math.ceil(S.freezeCd):"⏱ kész"):""}`,W-10,18); ctx.textAlign="left";
    if(S.msgT>0){ ctx.fillStyle="rgba(22,50,79,.85)"; ctx.font="700 14px system-ui,sans-serif"; ctx.textAlign="center"; ctx.fillText(S.msg,W/2,60); ctx.textAlign="left"; }
    if(S.over){ ctx.fillStyle="rgba(22,50,79,.78)"; ctx.fillRect(15,70,330,100); ctx.fillStyle="#fff"; ctx.textAlign="center";
      ctx.font="700 18px system-ui,sans-serif"; ctx.fillText(S.won?"TÚLÉLTED KARÁCSONYIG! 🎄🎉":"Felismerted a dalt! 💀",W/2,102);
      ctx.font="14px system-ui,sans-serif"; ctx.fillText(`${Math.min(24,day()).toFixed(2).replace(".",",")} napot bírtál${practice?" (gyakorló)":""}`,W/2,126); ctx.fillText("Koppints vagy nyomd meg a ▲ gombot az újrához",W/2,150); ctx.textAlign="left"; }
    G.raf=requestAnimationFrame(step);
  }
  G.raf=requestAnimationFrame(step);
}
function drawHero(ctx,P){
  const h=P.crouch?24:44, x=P.x, y=P.y;
  ctx.fillStyle="#2c6fa8"; ctx.fillRect(x+2,y-h+14,18,h-14);
  ctx.fillStyle="#f1cfb3"; ctx.beginPath(); ctx.arc(x+11,y-h+8,8,0,6.3); ctx.fill();
  ctx.strokeStyle="#16324f"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x+11,y-h+8,10,Math.PI,0); ctx.stroke();
  ctx.fillStyle="#d7263d"; ctx.fillRect(x-1,y-h+4,5,9); ctx.fillRect(x+18,y-h+4,5,9);
  ctx.fillStyle="#16324f"; ctx.fillRect(x+4,y-6,5,6); ctx.fillRect(x+13,y-6,5,6);
}
function drawMariah(ctx,x,GY,open){
  ctx.fillStyle="#d7263d"; ctx.beginPath(); ctx.moveTo(x,GY-70); ctx.lineTo(x-22,GY); ctx.lineTo(x+22,GY); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillRect(x-12,GY-72,24,5);
  ctx.fillStyle="#f1cfb3"; ctx.beginPath(); ctx.arc(x,GY-82,10,0,6.3); ctx.fill();
  ctx.fillStyle="#d1a85f"; ctx.beginPath(); ctx.arc(x,GY-86,11,Math.PI,0); ctx.fill();
  ctx.fillStyle="#d7263d"; ctx.beginPath(); ctx.moveTo(x-10,GY-90); ctx.lineTo(x+4,GY-106); ctx.lineTo(x+12,GY-90); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x+4,GY-107,3,0,6.3); ctx.fill();
  ctx.fillStyle=open?"#7a1d1d":"#c4554f"; ctx.beginPath(); ctx.ellipse(x-3,GY-78,open?4:3,open?4:1.5,0,0,6.3); ctx.fill();
  ctx.strokeStyle="#f1cfb3"; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x-12,GY-58); ctx.lineTo(x-26,GY-66); ctx.stroke();
  ctx.fillStyle="#333"; ctx.beginPath(); ctx.arc(x-28,GY-67,3.5,0,6.3); ctx.fill();
}
function drawWave(ctx,w){
  const cy=w.y+w.h/2;
  ctx.save(); ctx.strokeStyle="#d7263d"; ctx.lineWidth=3; ctx.lineCap="round";
  for(let i=0;i<3;i++){ ctx.globalAlpha=1-i*0.25; ctx.beginPath(); ctx.arc(w.x+w.w-6-i*6,cy,w.h/2-2+i*5,Math.PI*0.62,Math.PI*1.38); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle="#16324f"; ctx.font="bold 15px sans-serif"; ctx.textAlign="center"; ctx.fillText(w.type==="low"?"♫":"♪",w.x+w.w/2-2,cy+5); ctx.textAlign="left";
}
