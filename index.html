<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karácsonyi Túlélőközpont</title>
<meta name="theme-color" content="#dcecf8">
<meta name="description" content="Mariahrmageddon, Whamageddon, Feliznavidageddon – kiesésbejelentő és statisztika a Kecskeméti Fiatalok Társaságától.">
<link rel="manifest" href="manifest_v10.webmanifest">
<meta property="og:type" content="website"><meta property="og:site_name" content="Karácsonyi Túlélőközpont">
<meta property="og:title" content="Karácsonyi Túlélőközpont"><meta property="og:description" content="Mariahrmageddon, Whamageddon, Feliznavidageddon – három dal, egyetlen cél: túlélni. Kecskeméti Fiatalok Társasága.">
<meta property="og:image" content="https://bela23ah.github.io/mariahrmageddon/og/main.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://bela23ah.github.io/mariahrmageddon/"><meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Túlélőközpont">
<style>
:root{--bg:#eef6fc;--card:#fff;--line:#d3e5f3;--txt:#16324f;--mut:#6b86a0;--red:#d7263d;--grn:#2a9d6f;--ice:#8cc3ea;--blue:#2c6fa8;--warn:#d97706;--navh:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(180deg,#dcecf8 0,var(--bg) 380px,#f8fbfe 100%) fixed;color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;background:rgba(238,246,252,.9);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
header b{font-size:1rem;letter-spacing:.2px}
main{max-width:640px;margin:0 auto;padding:8px 16px calc(var(--navh) + 36px + env(safe-area-inset-bottom));position:relative;z-index:2}
h1{font-size:1.45rem;margin:.1em 0;text-align:center;letter-spacing:.4px}
h2{font-size:1.1rem;margin:1.4em 0 .5em}
h3{font-size:1rem;margin:.2em 0 .4em}
p{margin:.5em 0}
.sub{color:var(--mut);margin:0 0 .6em;text-align:center}
.hero{text-align:center;padding:8px 0 0}
.hero svg{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.hero .count{font-size:1.05rem;font-weight:600;margin:6px 0 2px}
button,.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.pri,.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.fb,.btn.fb{background:#1877f2;border-color:#1877f2;color:#fff;font-weight:600}
button.on{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:600}
button.warn{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
button.sm,.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:9px}
button.wide{width:100%}
button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 6px 18px -12px rgba(22,50,79,.25)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.alive{background:#dff4ea;color:var(--grn)}
.dead{background:#fde2e5;color:var(--red)}
.soon{background:#e6eff7;color:var(--mut)}
.locked{background:#e2e8f0;color:#475569}
.mut{color:var(--mut);font-size:.9rem}
input,select,textarea{width:100%;background:#f7fbff;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px}
label{font-size:.9rem;color:var(--mut)}
.chk{display:flex;gap:8px;align-items:center;color:var(--txt);margin:6px 0}
.chk input{width:auto;margin:0}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
.hide{display:none!important}

/* csempék */
.tiles{display:grid;gap:12px;margin:12px 0}
.tile{position:relative;text-align:left;width:100%;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:0 10px 24px -16px rgba(22,50,79,.45);display:flex;gap:14px;align-items:center;overflow:hidden;border-left:7px solid var(--accent,var(--ice))}
.tile:active{transform:scale(.99)}
.tile .ico{font-size:2.1rem;line-height:1;flex:none}
.tile .t{flex:1;min-width:0}
.tile .t b{display:block;font-size:1.12rem}
.tile .t span{display:block;color:var(--mut);font-size:.88rem}
.tile.out{background:#fbf3f4;border-left-color:var(--red)}
.tile.dim{opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{flex-direction:column;align-items:flex-start;text-align:left;border-left:1px solid var(--line);border-top:5px solid var(--ice);min-height:108px;padding:14px}
.mini.lock{opacity:.6}

/* alsó menü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mut);max-width:110px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.act{color:var(--red);font-weight:700}
nav button.plus .pl{width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -4px rgba(215,38,61,.6)}
nav button.plus svg{stroke:#fff;width:26px;height:26px;stroke-width:2.4}

/* sheet / oldal */
.modal{position:fixed;inset:0;background:rgba(22,50,79,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;overflow:auto}
.modal>div{background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grip{width:42px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 12px}
.page{position:fixed;inset:0;z-index:9;background:linear-gradient(180deg,#dcecf8 0,var(--bg) 300px,#f8fbfe 100%);overflow:auto}
.page .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;background:rgba(238,246,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:2}
.page .pb{max-width:640px;margin:0 auto;padding:8px 16px calc(40px + env(safe-area-inset-bottom))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border-radius:99px;padding:7px 13px;font-size:.92rem}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:#f8fbfe;font-size:.88rem;color:var(--txt);margin:0 6px 6px 0}
.pill input{width:auto;margin:0}
.notice{border-left:4px solid var(--ice);background:#f3f9fe;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.93rem}
.notice.red{border-color:var(--red);background:#fff4f5}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.steps li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
ol.rules{padding-left:1.2em;margin:.3em 0}
ol.rules li{margin:.55em 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin:8px 0}
details summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"＋";float:right;color:var(--mut)}
details[open] summary:after{content:"－"}
details p{margin:0 0 12px}
.seg{display:flex;gap:6px;background:#e3eef8;border-radius:12px;padding:4px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px}
.seg button.sel{background:#fff;font-weight:700;box-shadow:0 1px 4px rgba(22,50,79,.15)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.mode-card{text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px;background:#f8fbfe;display:flex;flex-direction:column;gap:4px}
.mode-card span{font-size:.8rem;color:var(--mut)}
.mode-card.active{border-color:var(--red);background:#fff5f5}
.yt-thumb{width:96px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}

/* statisztika */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .card{text-align:center;margin:0;padding:12px 6px}
.num{font-size:1.6rem;font-weight:800}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9rem}
.bar span.l{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:12px;background:linear-gradient(90deg,var(--ice),#4a9ad4);border-radius:6px;min-width:2px}
.bar em{font-style:normal;color:var(--mut)}
.feed>div{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}

/* térkép, játék */
#map{height:calc(100vh - 360px);min-height:300px;border-radius:16px;border:1px solid var(--line);overflow:hidden;z-index:1}
#gc{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:#dcecf8;touch-action:none;display:block}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.ctl button{font-size:1.5rem;padding:14px 0;user-select:none;-webkit-user-select:none;touch-action:none}

/* dalok */
.play{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.play.go{background:#eaf5fd;border-color:var(--ice)}
.play.off{background:#f3f6f9;color:#9fb0c0;cursor:not-allowed;text-decoration:line-through;text-decoration-color:var(--red)}
.play svg{width:20px;height:20px}

/* hó, olvadás */
#snow{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.flake{position:absolute;top:-10px;background:#fff;border-radius:50%;opacity:.85;box-shadow:0 0 4px rgba(140,195,234,.7);animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0)}}
.drip{animation:drip 2.6s ease-in infinite;opacity:0}
@keyframes drip{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}85%{opacity:.9}100%{opacity:0;transform:translateY(var(--d))}}
@media (prefers-reduced-motion:reduce){.flake,.drip{animation:none}.flake{display:none}.modal>div{animation:none}}

/* egységes irányító gombok + arcade ranglista */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 8px}
.pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 8px}
.gbtn{height:60px;border-radius:18px;background:linear-gradient(180deg,#fff,#e9f3fb);border:1px solid var(--line);box-shadow:0 3px 0 #c5dbed;color:var(--blue);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
.gbtn:active{transform:translateY(3px);box-shadow:0 0 0 #c5dbed}
.gbtn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gbtn small{font-size:.72rem;font-weight:600}
.gbtn.lockd{opacity:.35}
.arcade{background:#101a2c;color:#ffd166;border-radius:14px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;margin-bottom:10px}
.arcade .ah{text-align:center;color:#8cc3ea;letter-spacing:2px;margin-bottom:6px}
.arcade .ar{display:grid;grid-template-columns:2.2em 1fr auto 1.6em;gap:8px;padding:2px 0}
.arcade .ar.me{color:#fff;background:rgba(255,255,255,.08);border-radius:6px}
.arcade .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cbar{position:relative;display:flex;height:24px;border-radius:12px;overflow:hidden;background:#fde2e5;border:1px solid var(--line)}
.cbar .ca{display:block;background:linear-gradient(90deg,#2a9d6f,#5cc79a);min-width:2px}
.cbar .co{display:block;background:#fde2e5}
.cbar .goal{position:absolute;top:0;bottom:0;width:2px;background:#16324f}
.cbar .goal em{position:absolute;top:-1px;left:5px;font-size:.68rem;font-style:normal;color:#16324f;font-weight:700;white-space:nowrap;line-height:24px;text-shadow:0 0 3px #fff,0 0 3px #fff}
.verdict{border-radius:12px;padding:10px 12px;font-weight:700;margin-top:4px}
.verdict.good{background:#e3f6ec;color:var(--grn)}
.verdict.warn{background:#fff3e0;color:#b45309}
.verdict.win{background:linear-gradient(90deg,#e3f6ec,#e6f2fb);color:var(--grn);text-align:center;font-size:1.05rem}
.verdict.storm{background:linear-gradient(120deg,#fff1e8,#e3f0fb,#ffe3d6);color:#c2410c;text-align:center;font-size:1.05rem;animation:storm 2.5s ease-in-out infinite alternate}
@keyframes storm{from{box-shadow:0 0 0 rgba(234,88,12,0)}to{box-shadow:0 0 18px rgba(234,88,12,.45)}}

.i{width:1.1em;height:1.1em;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;flex:none}
.i[data-f] path{fill:currentColor}
.i.g{color:var(--grn)}.i.r{color:var(--red)}
.tile .ico .i{width:1em;height:1em;color:var(--accent,var(--blue))}
header{align-items:flex-start}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.brand b{display:flex;align-items:center;gap:6px;font-size:.98rem}
#auth{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
button.adm{background:#16324f;border-color:#16324f;color:#fff}
.medals{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.medal{width:66px;overflow-wrap:anywhere;text-align:center;background:none;border:0;padding:0;font-size:.64rem;color:var(--mut);line-height:1.2}
.medal .mc{width:44px;height:44px;border-radius:50%;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;background:#e2e8f0;color:#94a3b8;border:2px solid #cbd5e1}
.medal.on .mc{background:var(--mcol);color:#fff;border-color:var(--mcol)}
.medal .i{width:22px;height:22px}
.prog{height:10px;border-radius:6px;background:#e2eaf2;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--grn)}
.advent{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:8px 0}
.advent span{aspect-ratio:1;border-radius:6px;background:#e2eaf2;font-size:.64rem;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.advent span.p{background:#bfe3d0;color:#1c6b49}.advent span.t{background:var(--red);color:#fff}.advent span.c{outline:2px solid var(--blue)}
.illus svg{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
#gc{touch-action:none;user-select:none;-webkit-user-select:none}
.empty{text-align:center;color:var(--mut);padding:14px}.empty .i{width:48px;height:48px;color:var(--ice);display:block;margin:0 auto 6px}
.pinx .i{width:30px;height:30px;stroke:#d7263d;fill:#fff;stroke-width:2}
.confetti{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none;overflow:visible}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:cf 3.2s linear infinite}
@keyframes cf{to{transform:translateY(420px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.legal{text-align:center;font-size:.8rem;color:var(--mut);margin:18px 0 0}.legal a{color:var(--blue);margin:0 6px}
header{flex-wrap:wrap}#outbar{flex-basis:100%}
.outbar{display:flex;align-items:center;gap:8px;width:100%;margin:6px 0 0;padding:7px 12px;border-radius:12px;background:#fff1f3;border:1px solid #f3c6cd;color:#9f1239;font-size:.85rem;font-weight:600;text-align:left;box-shadow:none}
.outbar small{font-weight:400;color:#b4566a;margin-left:auto}
.phw{position:sticky;top:0;z-index:2;background:rgba(238,246,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.phw .ph{position:static;border-bottom:0;background:none;backdrop-filter:none}.phw .outbar{margin:0 12px 8px;width:calc(100% - 24px)}
.bigout{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:16px;background:linear-gradient(135deg,#fff1f3,#ffe3e8);border:1.5px solid #f3a9b5;color:#7f1d33;margin:10px 0;box-shadow:0 4px 14px rgba(215,38,61,.12)}
.bigout .i{width:38px;height:38px;color:#d7263d}.bigout b{display:block;font-size:1.15rem}.bigout span{font-size:.85rem;color:#a3475a;font-weight:400}

/* v9 */
#view,#pbody{position:relative}
.medals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.medal{width:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:7px 2px 5px;border-radius:14px;background:#eef3f8;border:2px solid #dfe8f1;font-size:.64rem;line-height:1.15;min-height:92px;overflow-wrap:anywhere;color:var(--mut);cursor:pointer}
.medal .mc{margin:0}
.medal.on{background:var(--mcol);border-color:var(--mcol);color:#fff;font-weight:700}
.medal.on .mc{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.7);color:#fff}
.srow{display:flex;align-items:center;gap:12px}
.srow .sx{flex:1;min-width:0}
.srow .sb{flex:none;text-align:right}
@media(max-width:480px){.srow{flex-wrap:wrap}.srow .sb{width:100%;text-align:left}}
.lnk{color:var(--blue,#2c6fa8);font-weight:700;cursor:pointer;text-decoration:underline}
.illus.go{cursor:pointer}
.hunt{position:absolute;z-index:5;background:none;border:0;padding:0;line-height:0;cursor:pointer;opacity:.22;transition:opacity .2s,transform .2s;color:#d7263d}
.hunt:hover,.hunt:focus-visible{opacity:.9}
.hunt .i,.hunt svg{width:30px;height:30px}
.hunt.gf{color:#2c6fa8}
.hunt.pop{animation:hpop .5s forwards}
@keyframes hpop{to{transform:scale(2) rotate(20deg);opacity:0}}
#xpt{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#16324f;color:#fff;padding:9px 16px;border-radius:20px;font-weight:700;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
#xpt.show{opacity:1;transform:translateX(-50%)}
.xpbar{height:12px;border-radius:8px;background:#dbe8f3;overflow:hidden;margin:6px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#2c6fa8,#8cc3ea)}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pin{text-align:center;font-size:.68rem;line-height:1.15;padding:8px 3px;border-radius:14px;background:#eef3f8;border:2px solid #dfe8f1;color:var(--mut)}
.pin .pc{width:38px;height:38px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;background:#e2e8f0;color:#94a3b8}
.pin.on{background:#fff6e0;border-color:#e0932b;color:#16324f;font-weight:700}
.pin.on .pc{background:#e0932b;color:#fff}
.pin .i{width:20px;height:20px}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate}
.fl2{animation-duration:.9s}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.93,1.08) rotate(2deg)}100%{transform:scale(1.05,.94) rotate(-1deg)}}
.cglow{animation:cg 1.8s ease-in-out infinite alternate}@keyframes cg{from{opacity:.2}to{opacity:.8}}
@media(prefers-reduced-motion:reduce){.fl,.cglow,.hunt.pop{animation:none}}

const EMRE=new RegExp("("+EMRE_SRC+")️?","g"), EMTEST=new RegExp(EMRE_SRC);
const NOICO=/^(TEXTAREA|OPTION|SCRIPT|STYLE|TITLE|SELECT|NOSCRIPT)$/;
function icoizeText(n){
  const p=n.parentNode; if(!p||NOICO.test(p.nodeName)) return;
  const t=n.nodeValue; EMRE.lastIndex=0; let last=0,m,any=false; const f=document.createDocumentFragment();
  while((m=EMRE.exec(t))){ any=true; if(m.index>last) f.appendChild(document.createTextNode(t.slice(last,m.index)));
    const [nm,cl]=EMOJI[m[1]]; const tp=document.createElement("template"); tp.innerHTML=ico(nm,cl); f.appendChild(tp.content); last=m.index+m[0].length; }
  if(!any) return; if(last<t.length) f.appendChild(document.createTextNode(t.slice(last))); p.replaceChild(f,n);
}
function icoize(root){
  if(!root) return;
  if(root.nodeType===3){ if(EMTEST.test(root.nodeValue)) icoizeText(root); return; }
  if(root.nodeType!==1) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), list=[]; let n;
  while((n=w.nextNode())) if(EMTEST.test(n.nodeValue)) list.push(n);
  list.forEach(icoizeText);
}
const icoQ=new Set(); let icoRaf=0;
new MutationObserver(ms=>{

  if(!icoRaf) icoRaf=requestAnimationFrame(()=>{ icoRaf=0; const q=[...icoQ]; icoQ.clear(); q.forEach(icoize); });
}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});

/* Olvasáscsökkentés: a konfig és a pillanatképek (térkép, statisztika) 1-1 dokumentum, helyben gyorsítótárazva */
async function cachedDoc(name,ttl){
  const k="snap_"+name+YEAR, c=ls.get(k,null);
  if(c&&Date.now()-c.t<ttl) return c.d;
  try{ const s=await getDoc(doc(db,"config",name)); const d=s.exists()?s.data():null; ls.set(k,{t:Date.now(),d}); return d; }
  catch(e){ return c?c.d:null; }
}
async function loadConfig(){ const c=await cachedDoc("public",5*60e3); statsPublic=!!(c&&c.statsPublic); render(); loadNews(c&&c.newsV); }

/* ---------- „Élsz még?” e-mailből érkező válasz (?r=alive / ?r=out) ---------- */
function checkPendingReply(){
  const r=ls.get("pendingRep",null); if(!r||!user||!myPart||!mineReady||!elimsReady) return;
  ls.set("pendingRep",null);
  if(r==="alive"){
    touchRem(true);
    const left=KEYS.filter(k=>joinedOf(k)&&!myElim(k));
    modal(`<div class="grip"></div><h3 style="margin:0 0 6px">Igen, még élsz!</h3><p>Örülünk, hogy még bírod${left.length?": "+left.map(k=>CH[k].short).join(", ")+" fronton bent vagy":""}. Tartsd magad karácsonyig!</p><p class="mut">${MOTTO}</p><button class="pri wide" id="x">Rendben</button>`);
    $("#x").onclick=closeModal; return;
  }
  outFlow();
}
function outFlow(){
  if(!canReport()){ modal(`<div class="grip"></div><h3>Kiesés bejelentése</h3><p>Bejelentést a játék ideje alatt (dec. 1. – dec. 24.), illetve utólag az év végéig lehet tenni.</p><button class="wide" id="x">Rendben</button>`); $("#x").onclick=closeModal; return; }
  const open=KEYS.filter(k=>joinedOf(k)&&!myElim(k));
  if(!open.length){ modal(`<div class="grip"></div><h3>Már mindenhonnan kiestél</h3><p>Minden frontról rögzítve van a kiesésed.</p><button class="wide" id="x">Rendben</button>`); $("#x").onclick=closeModal; return; }
  if(myPart.mode!=="diehard"||open.length===1) return reportSheet(open[0]);
  modal(`<div class="grip"></div><h3 style="margin:0 0 6px">Melyikből estél ki?</h3><p class="mut" style="margin:0 0 8px">Die Hard módban egyszerre több frontról is kieshettél. Jelöld be az összeset, amiből kiestél.</p>
   ${open.map(k=>`<label class="chk"><input type="checkbox" class="ofr" value="${k}"> <b>${CH[k].name}</b> <span class="mut">(${esc(CH[k].song)})</span></label>`).join("")}
   <div class="err" id="er"></div><button class="pri wide" id="ok">Tovább</button><button class="wide" style="margin-top:8px" id="x">Mégse</button>`);
  $("#x").onclick=closeModal;
  $("#ok").onclick=()=>{ const sel=[...document.querySelectorAll(".ofr:checked")].map(c=>c.value); if(!sel.length) return $("#er").textContent="Jelölj meg legalább egy frontot."; reportSheet(null,null,sel); };
}

function subscribe(){
  subs.forEach(f=>f()); subs=[]; elims=[]; mineReady=false; elimsReady=false; myPart=null;
  if(!user) return;
  /* csak a saját dokumentumaink élő figyelése – néhány olvasás, nem az egész gyűjtemény */
  subs.push(onSnapshot(doc(db,"participations",`${YEAR}_${user.uid}`),s=>{myPart=s.exists()?{id:s.id,...s.data()}:null;mineReady=true;render();maybeOnboard();if(myPart){touchRem();checkPendingTeam();checkPendingReply()}},e=>{console.error(e);mineReady=true;render()}));
  subs.push(onSnapshot(query(collection(db,"eliminations"),where("uid","==",user.uid),where("year","==",YEAR)),s=>{elims=s.docs.map(d=>({id:d.id,...d.data()}));elimsReady=true;render();checkPendingReply()},e=>console.error(e)));
}
function maybeOnboard(){
  if(user&&userLoaded&&mineReady&&(!userDoc||!myPart)&&onboardFor!==user.uid){ onboardFor=user.uid; onboarding(); }
}

const myElim = k => elims.find(e=>e.uid===user?.uid && e.challenge===k);

const myElims = () => elims.filter(e=>e.uid===user?.uid);

async function loadRem(){
  try{ const s=await getDoc(doc(db,"reminders",user.uid)); rem=s.exists()?s.data():null; }catch(e){}
  remLoaded=true; touchRem();
}
async function setReminder(on){
  if(!user||!user.email) throw new Error("Nincs e-mail-cím a fiókhoz.");
  await setDoc(doc(db,"reminders",user.uid),{email:user.email,optIn:on,alive:isAlive(),lastSeen:serverTimestamp(),year:YEAR});
  rem={email:user.email,optIn:on}; ls.set("remSeen",Date.now());
}
async function touchRem(force){
  if(!user||!rem||!rem.optIn||!myPart) return;
  if(!force&&Date.now()-ls.get("remSeen",0)<12*3600e3) return;
  try{ await updateDoc(doc(db,"reminders",user.uid),{lastSeen:serverTimestamp(),alive:isAlive()}); ls.set("remSeen",Date.now()); }catch(e){}
}

/* ---------- Admin: adatok kézi/éves betöltése (nem élő figyelés – ezzel spórolunk az olvasásokon) ---------- */
async function loadAdminData(force){
  if(!isAdmin||AD.loading) return;
  if(AD.loaded&&!force&&Date.now()-AD.t<5*60e3) return;
  AD.loading=true;
  try{
    const Y=where("year","==",YEAR);
    const [a,b,c,d,e2,f2]=await Promise.all([getDocs(query(collection(db,"participations"),Y)),getDocs(query(collection(db,"eliminations"),Y)),getDocs(query(collection(db,"dangerZones"),Y)),getDocs(collection(db,"users")),getDocs(query(collection(db,"safeZones"),Y)),getDocs(collection(db,"games",String(YEAR),"xp")).catch(()=>({docs:[]}))]);
    AD.xps={}; f2.docs.forEach(x=>AD.xps[x.id]=x.data());
    AD.parts=a.docs.map(x=>({id:x.id,...x.data()})); AD.elims=b.docs.map(x=>({id:x.id,...x.data()}));
    AD.dangers=c.docs.map(x=>({id:x.id,...x.data()})); AD.users=d.docs.map(x=>({id:x.id,...x.data()})); AD.safes=e2.docs.map(x=>({id:x.id,...x.data()}));
    AD.loaded=true; AD.t=Date.now();
  }catch(e){console.error(e)}
  AD.loading=false;
  render();
  await maybeAutoPublish();
}
async function maybeAutoPublish(){
  if(!isAdmin||!AD.loaded) return;
  try{ const s=await getDoc(doc(db,"config","mapSnapshot")); const t=s.exists()?(s.data().t||0):0; if(Date.now()-t>5*60e3) await publishSnapshots(); }catch(e){console.error(e)}
}

function viewHome(v){
  const n=nowDate(), b=bounds(), ph=phase(), landing=!user;
  let hero="", line="";
  if(ph==="before"){
    const total=Math.round((b.start-b.melt)/DAY), el=Math.floor((n-b.melt)/DAY), left=Math.ceil((b.start-n)/DAY);
    hero=iceSvg(clamp(el/total));
    line = left<=1 ? "Holnap kezdődik. Mariah már alig bírja a jeget…" : `Még ${left} nap, és Mariah kiolvad a jégből.`;
  } else if(ph==="during"){
    hero=treeSvg(Math.ceil((n-b.start)/DAY),Math.max(0,Math.ceil((b.end-n)/DAY)),myElims().length);
    line=`Mariah szabadon jár. Bírd ki karácsonyig!`;

  v.innerHTML=`${confetti()}<div class="hero">${hero}<h1>Karácsonyi Túlélőközpont</h1><p class="count">${line}</p>${landing?`<p class="sub">Ingyenes karácsonyi kihívás az ünnepekre</p>`:""}</div>

  <div class="card"><h3>A három front</h3><div class="fronts3">${KEYS.map(k=>`<div>${CH[k].ico}<b>${CH[k].name}</b>${CH[k].song}</div>`).join("")}</div></div>

let fitted=false;
function refreshMarkers(fit){
  if(!mapObj||!elimLayer) return;
  elimLayer.clearLayers(); dangerLayer.clearLayers();
  const pts=[];
  if(showElim&&MS){
    (MS.cells||[]).forEach(o=>{
      const by={}; KEYS.forEach(k=>{ if((mapFilter==="all"||mapFilter===k)&&o[CK[k]]) by[k]=o[CK[k]]; });
      const n=Object.values(by).reduce((a,x)=>a+x,0); if(!n) return;
      const col=Object.keys(by).length>1?"#d7263d":CH[Object.keys(by)[0]].accent;
      const m=L.circleMarker([o.lat,o.lng],{radius:7+Math.min(20,Math.sqrt(n)*5),color:"#fff",weight:2,fillColor:col,fillOpacity:.8});
      m.bindPopup(`<b>${esc(o.n)}</b><br>${n} kiesés<br>`+Object.entries(by).map(([k,c])=>`${CH[k].ico} ${CH[k].short}: ${c}`).join("<br>"));
      m.addTo(elimLayer); pts.push([o.lat,o.lng]);
    });
  }
  if(MS&&showSafe){
    (MS.sz||[]).forEach(z=>{
      const icon=L.divIcon({className:"",html:`<div style="background:#2c6fa8;color:#fff;border:2px solid #fff;border-radius:99px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35)">${ico("shield")}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
      L.circle([z.lat,z.lng],{radius:z.rad||30,color:"#2c6fa8",weight:2,fillColor:"#2c6fa8",fillOpacity:.15}).addTo(dangerLayer);
      L.marker([z.lat,z.lng],{icon}).bindPopup(`<b>Biztonságos hely: ${esc(z.n)}</b> (${esc(z.s)})<br><small>${esc(z.c)}${z.a?" · "+esc(z.a):""}<br>Nem játssza: ${(z.sg||[]).map(x=>CH[x]?.short).filter(Boolean).join(", ")}${z.q?"<br>Csendes órák: "+esc(z.q):""}</small>`).addTo(dangerLayer);
    });
  }
  if(MS){
    (MS.dz||[]).filter(d=>mapFilter==="all"||(d.sg||[]).includes(mapFilter)).forEach(d=>{
      const real=!!d.real; if(real?!showDanger:!showSusp) return;
      const col=real?"#b91c1c":"#d97706", sz=real?26:20;
      const icon=L.divIcon({className:"",html:`<div style="background:${real?col:"#fff"};color:${real?"#fff":col};border:2px ${real?"solid #fff":"dashed "+col};border-radius:99px;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.35)">${real?"!":"?"}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      const songs=(d.sg||[]).map(x=>CH[x]?.short).filter(Boolean).join(", "), ld={halk:"halk",kozepes:"közepes",hangos:"hangos"}[d.l]||"";
      if(d.rad) L.circle([d.lat,d.lng],{radius:d.rad,color:col,weight:2,dashArray:real?null:"6 6",fillColor:col,fillOpacity:real?.2:.08}).addTo(dangerLayer);
      L.marker([d.lat,d.lng],{icon}).bindPopup(`<b>${real?"Veszélyzóna":"Feltételezett kerülendő hely"}: ${esc(d.p)}</b> (${esc(d.s)})<br><small>${esc(d.c)} · ${esc(songs)}${ld?" · "+ld:""}${d.rad?" · kb. "+d.rad+" m":""}${real?" · "+d.n+" kiesés itt":""}</small>${d.note?`<p style="margin:4px 0 0;font-size:12px">„${esc(d.note)}”</p>`:""}`).addTo(dangerLayer);
    });
  }
  if((fit||!fitted)&&pts.length){ fitted=true; if(pts.length===1) mapObj.setView(pts[0],9); else mapObj.fitBounds(pts,{padding:[30,30],maxZoom:10}); }
}
let pickMap=null, pickMarker=null, pickCircle=null;
const LOUD={halk:["Halk",15],kozepes:["Közepes",40],hangos:["Hangos",80]};

  <label>Becsült hallótávolság: <b id="drv"></b> m</label><input type="range" id="drad" min="5" max="150" step="5" value="${d.radius||LOUD[ld][1]}">
  <div class="mut" style="margin:-4px 0 8px">Kb. 60–80 dB hangnyomásnál a dal nagyjából ekkora körzetben ismerhető fel. A kör a térképen is látszik.</div>
  <label>Kategória</label><select id="dcat">${DANGER_CATS.map(c=>`<option ${c===d.category?"selected":""}>${c}</option>`).join("")}</select>
  <label>Hallott dalok</label>${KEYS.map(k=>`<label class="chk"><input type="checkbox" class="dsong" value="${k}" ${(d.songs?d.songs.includes(k):k==="mariah")?"checked":""}> ${CH[k].name}</label>`).join("")}
  <label>Megjegyzés (opcionális, max. 200 karakter)</label><textarea id="dnote" rows="2" maxlength="200">${esc(d.note||"")}</textarea>`;

function dzBind(d){
  d=d||{}; const ld=d.loud||"kozepes", S={pos:d.lat!=null?{lat:d.lat,lng:d.lng}:null,loud:ld,rad:d.radius||(d.safe?30:LOUD[ld][1]),place:null};
  const upd=()=>{ if($("#drv")) $("#drv").textContent=S.rad; if($("#drad")) $("#drad").value=S.rad; if(pickCircle) pickCircle.setRadius(S.rad); };
  $("#dloud")?.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ S.loud=b.dataset.l; S.rad=LOUD[S.loud][1]; $("#dloud").querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b)); upd(); });
  if($("#drad")) $("#drad").oninput=e=>{ S.rad=+e.target.value; upd(); };
  loadLeaflet().then(()=>{
    if(!$("#pmap")) return; if(pickMap){ try{pickMap.remove()}catch(e){} pickMarker=pickCircle=null; }
    const cc=cityCoords($("#dcity").value), c=S.pos?[S.pos.lat,S.pos.lng]:cc?[cc.lat,cc.lng]:[47.1,19.5];
    pickMap=L.map("pmap").setView(c,S.pos?17:cc?13:7);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(pickMap);
    const icon=L.divIcon({className:"pinx",html:ico("pin"),iconSize:[30,30],iconAnchor:[15,30]});
    const place=ll=>{ S.pos={lat:+ll.lat.toFixed(4),lng:+ll.lng.toFixed(4)};
      if(!pickMarker){ pickMarker=L.marker(ll,{icon,draggable:true}).addTo(pickMap); pickMarker.on("dragend",e=>place(e.target.getLatLng())); } else pickMarker.setLatLng(ll);
      if(!pickCircle) pickCircle=L.circle(ll,{radius:S.rad,color:"#d97706",weight:2,dashArray:"6 6",fillOpacity:.12}).addTo(pickMap); else pickCircle.setLatLng(ll);
      const h=$("#dhint"); if(h) h.textContent="Hely kijelölve."; };
    S.place=place; pickMap.on("click",e=>place(e.latlng)); if(S.pos) place(S.pos);
    setTimeout(()=>{ try{pickMap&&pickMap.invalidateSize()}catch(e){} },250);
  }).catch(()=>{ const h=$("#dhint"); if(h) h.textContent="A térképhez internet kell – add meg a címet."; });
  $("#dloc").onclick=()=>{ if(!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(p=>{ const ll={lat:p.coords.latitude,lng:p.coords.longitude}; S.place&&S.place(ll); pickMap&&pickMap.setView([ll.lat,ll.lng],17); },()=>{ $("#dhint").textContent="Nem sikerült a helymeghatározás."; },{timeout:8000}); };
  $("#dfind").onclick=async()=>{ const q=($("#daddr").value+" "+$("#dcity").value).trim(); if(q.length<3) return;
    try{ const r=await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=hu&q="+encodeURIComponent(q))).json();
      if(r[0]){ const ll={lat:+r[0].lat,lng:+r[0].lon}; S.place&&S.place(ll); pickMap&&pickMap.setView([ll.lat,ll.lng],17); } else $("#dhint").textContent="Nem találtam a címet – bökj a térképre.";
    }catch{ $("#dhint").textContent="A címkeresés most nem érhető el – bökj a térképre."; } };
  upd(); return S;
}
function dzRead(S){
  const city=$("#dcity").value.trim(), place=$("#dplace").value.trim(), addr=$("#daddr").value.trim();
  const songs=[...document.querySelectorAll("#modal .dsong:checked")].map(c=>c.value);
  if(!city||place.length<2) return {err:"A település és a helyszín neve kötelező."};
  if(!S.pos&&addr.length<3) return {err:"Adj meg címet, vagy bökj a térképre."};
  if(!songs.length) return {err:"Jelölj meg legalább egy dalt."};
  const data={settlement:city,place,category:$("#dcat").value,songs,riskLevel:"high",note:$("#dnote").value.trim(),loud:S.loud,radius:S.rad,addr};
  if(S.pos){ data.lat=S.pos.lat; data.lng=S.pos.lng; }
  return {data};
}

function dzEdit(id){
  const d=AD.dangers.find(x=>x.id===id); if(!d) return;
  const n=AD.elims.filter(e=>e.zoneId===id).length;
  modal(`<div class="grip"></div><h3 style="margin:0 0 6px">Kerülendő hely szerkesztése</h3><p class="mut" style="margin:0 0 8px">Beküldő: ${esc(nameOf(d.uid))} · kiesés itt: <b>${n}</b> ${n?"(ezért valódi veszélyzóna)":""}</p>
  ${dzFormHtml(d)}
  <label class="chk"><input type="checkbox" id="dapp" ${d.approved?"checked":""}> Jóváhagyva (megjelenik a térképen)</label>
  <label class="chk"><input type="checkbox" id="dreal" ${d.real?"checked":""}> Kézzel valódi veszélyzónának jelölöm</label>
  <div class="err" id="er"></div><button class="pri wide" id="ok">Mentés</button>
  <div class="row" style="margin-top:8px"><button id="del" style="color:var(--red)">Törlés</button><button id="x">Mégse</button></div>`);
  $("#x").onclick=closeModal;
  const S=dzBind(d);
  const after=async()=>{ await loadAdminData(true); try{ await publishSnapshots(); }catch(e){} };
  $("#ok").onclick=async()=>{
    const r=dzRead(S); if(r.err) return $("#er").textContent=r.err;
    try{ await updateDoc(doc(db,"dangerZones",id),{...r.data,approved:$("#dapp").checked,real:$("#dreal").checked}); closeModal(); await after(); }catch(e){ $("#er").textContent=msg(e); }
  };
  $("#del").onclick=async()=>{ if(!confirm("Törlöd ezt a jelzést?")) return; try{ await deleteDoc(doc(db,"dangerZones",id)); closeModal(); await after(); }catch(e){ $("#er").textContent=msg(e); } };
}

function compressImage(file,maxW=800,maxB=70000){
  return new Promise((res,rej)=>{ const im=new Image(), u=URL.createObjectURL(file);
    im.onload=()=>{ let w=Math.min(maxW,im.width), q=.75, out;
      for(let k=0;k<8;k++){ const c=document.createElement("canvas"); c.width=w; c.height=Math.round(im.height*w/im.width); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q); if(out.length*0.75<=maxB) break; if(q>.45) q-=.1; else w=Math.round(w*.8); }
      URL.revokeObjectURL(u); out.length*0.75<=maxB*1.5?res(out):rej(new Error("A kép túl nagy.")); };
    im.onerror=()=>rej(new Error("A képet nem lehet beolvasni.")); im.src=u; });
}

const nameOf = uid => AD.users.find(u=>u.id===uid)?.nick || AD.parts.find(p=>p.uid===uid)?.nick || "Játékos";
const topN=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([l,c])=>({l,n:c}));
function summarize(){
  const per={mariah:{j:0,o:0},wham:{j:0,o:0},feliz:{j:0,o:0}}, city={}, circ={}, daily=new Array(72).fill(0), elimOf={};
  AD.elims.forEach(e=>{
    (elimOf[e.uid]??=new Set()).add(e.challenge); if(per[e.challenge]) per[e.challenge].o++;
    const c=(e.settlement||"?").trim(); city[c]=(city[c]||0)+1; circ[e.circumstance]=(circ[e.circumstance]||0)+1;
    const d=e.occurredAt?.toDate?.(); if(d&&d.getMonth()===11){const i=d.getDate()-1; const k=KEYS.indexOf(e.challenge); if(i>=0&&i<24&&k>=0) daily[i*3+k]++;}
  });
  AD.parts.forEach(p=>(p.challenges||[]).forEach(k=>per[k]&&per[k].j++));
  const active=AD.parts.filter(p=>(elimOf[p.uid]?.size||0)<(p.challenges?.length||1)).length;
  const dh=AD.parts.filter(p=>p.mode==="diehard"&&!(elimOf[p.uid]?.size));
  return {year:YEAR,t:Date.now(),players:AD.parts.length,active,elims:AD.elims.length,
    classic:AD.parts.filter(p=>p.mode!=="diehard").length,diehard:AD.parts.filter(p=>p.mode==="diehard").length,
    multi:Object.values(elimOf).filter(x=>x.size>=2).length,per,city:topN(city,15),circ:topN(circ,10),daily,dhAlive:dh.length,_elimOf:elimOf,_dh:dh};
}
function buildMapSnap(){
  const g={};
  AD.elims.forEach(e=>{
    const c=(e.lat!=null&&e.lng!=null)?{lat:e.lat,lng:e.lng}:cityCoords(e.settlement); if(!c) return;
    const o=(g[c.lat+","+c.lng]??={n:e.settlement,lat:c.lat,lng:c.lng,m:0,w:0,f:0}); o[CK[e.challenge]]++;
  });
  const dz=[], cnt={}, sz=(AD.safes||[]).filter(z=>z.approved&&z.lat!=null).map(z=>({id:z.id,n:z.name,s:z.settlement,c:z.category,a:z.addr||"",lat:z.lat,lng:z.lng,rad:30,sg:z.songs||["mariah"],q:z.quiet||""}));
  AD.elims.forEach(e=>{ if(e.zoneId) cnt[e.zoneId]=(cnt[e.zoneId]||0)+1; });
  AD.dangers.filter(d=>d.approved).forEach(d=>{
    let lat,lng;
    if(d.lat!=null&&d.lng!=null){ lat=d.lat; lng=d.lng; }
    else { const c=cityCoords(d.settlement); if(!c) return; let h=0; for(const ch of d.place) h=(h*31+ch.charCodeAt(0))|0; h=Math.abs(h); lat=c.lat+((h%7)-3)*0.004; lng=c.lng+(((h>>3)%7)-3)*0.006; }
    const n=cnt[d.id]||0;
    dz.push({id:d.id,p:d.place,s:d.settlement,c:d.category,sg:d.songs,r:d.riskLevel,note:d.note||"",lat,lng,rad:d.radius||0,l:d.loud||"",n,real:!!(n||d.real)});
  });
  return {year:YEAR,t:Date.now(),cells:Object.values(g),dz,sz};
}
function buildCollective(){
  const out=new Set(AD.elims.filter(e=>e.challenge==="mariah").map(e=>e.uid)), towns={};
  const eo={}; AD.elims.forEach(e=>{(eo[e.uid]??=new Set()).add(e.challenge)});
  const out3=new Set(AD.parts.filter(p=>{const s=eo[p.uid]; if(!s) return false; return p.mode==="diehard"?s.size>0:s.has("feliz")}).map(p=>p.uid));
  AD.parts.forEach(p=>{ const h=(p.home||"").trim(); if(!h) return; const o=(towns[h.toLowerCase()]??={l:h,n:0,a:0,a3:0}); o.n++; if(!out.has(p.uid)) o.a++; if(!out3.has(p.uid)) o.a3++; });
  return {year:YEAR,t:Date.now(),reg:AD.parts.length,alive:AD.parts.filter(p=>!out.has(p.uid)).length,towns:Object.values(towns).sort((a,b)=>b.n-a.n).slice(0,40)};
}

const bars=arr=>{ if(!arr||!arr.length) return `<div class="mut">Még nincs adat.</div>`; const m=arr[0].n; return arr.map(({l,n})=>`<div class="bar"><span class="l">${esc(l)}</span><i style="width:${Math.max(2,n/m*45)}%"></i><em>${n}</em></div>`).join(""); };
function dailyChart(daily){
  const tot=i=>daily[i*3]+daily[i*3+1]+daily[i*3+2];
  const max=Math.max(1,...Array.from({length:24},(_,i)=>tot(i))), bw=480/24, H=105;
  let svg=`<svg viewBox="0 0 480 140" style="width:100%" role="img" aria-label="Napi kiesések decemberben"><line x1="0" y1="120" x2="480" y2="120" stroke="#d3e5f3"/>`;
  for(let i=0;i<24;i++){ let y=120; KEYS.forEach((k,j)=>{const h=daily[i*3+j]/max*H; if(h>0){y-=h; svg+=`<rect x="${(i*bw+2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${CH[k].accent}"/>`}});
    if(i%3===0||i===23) svg+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="134" font-size="9" text-anchor="middle" fill="#6b86a0">${i+1}.</text>`; }
  return svg+`</svg><div class="legend">${KEYS.map(k=>`<span><i style="background:${CH[k].accent}"></i>${CH[k].short}</span>`).join("")}<span>(december napjai)</span></div>`;
}

  };

/* ---------- Mini játék: Fülvédő futam 3.0 (becsületbeli ranglista) ---------- */
/* ===== MINIJÁTÉK-MAG: determinisztikus, rögzített időlépésű (1/30 s) szimuláció. A szerver már nem ellenőrzi: a pontszám becsületbeli ügy. ===== */
function mkSim(seed,T,noDeath){
  let a=seed>>>0;
  const rnd=()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
  const W=360,GY=196,DT=1/30;
  const P={x:60,y:GY,vy:0,crouch:false,jumps:0,inv:0}, K={l:false,r:false,d:false};
  const S={frame:0,t:0,waves:[],gifts:[],spawn:1.2,giftT:9+rnd()*6,over:false,won:false,shield:T>=4?1:0,slow:0,fast:0,freeze:0,dashCd:0,freezeCd:0,mouth:0,msg:"",msgT:0};
  const say=m=>{S.msg=m;S.msgT=2};
  const cl=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
  function input(c){
    if(S.over) return;
    switch(c){
      case 0:K.l=true;break; case 1:K.l=false;break; case 2:K.r=true;break; case 3:K.r=false;break; case 4:K.d=true;break; case 5:K.d=false;break;
      case 6: if(P.y>=GY-0.5&&!P.crouch){P.vy=-440;P.jumps=1} else if(T>=1&&P.jumps<2&&P.y<GY-0.5){P.vy=-400;P.jumps=2} break;
      case 7: if(T>=2&&S.dashCd<=0){P.inv=0.5;S.dashCd=6;say("⚡ Kitörés!")} break;
      case 8: if(T>=3&&S.freezeCd<=0){S.freeze=2;S.freezeCd=14;say("🕶️ Megállítottad a hangokat!")} break;
    }
  }
  const spawnWave=d=>{
    const mk=(type,dx)=>S.waves.push(type==="low"?{x:W-40+dx,y:GY-26,w:30,h:26,type}:{x:W-40+dx,y:GY-58,w:30,h:26,type});
    const r=rnd(); mk(rnd()<0.5?"low":"high",0);
    if(d>6&&r<0.25) mk(rnd()<0.5?"low":"high",95);
    if(d>14&&r<0.12) mk("low",190);
  };
  const gift=()=>{ const r=rnd();
    if(r<0.3){S.shield=Math.min(2,S.shield+1);say("🛡️ Pajzs!")}
    else if(r<0.55){S.slow=6;say("🐌 Lassítás 6 mp-re")}
    else if(r<0.8){S.t+=30;say("🎅 Fél nap ajándékba!")}
    else {S.fast=5;say("🔔 Csengőszó: gyorsulás!")} };
  const hit=w=>{ const ph=P.crouch?24:44, px=P.x+3, pw=16, py=P.y-ph+3, pH=ph-6; return px<w.x+w.w-3&&px+pw>w.x+3&&py<w.y+w.h-3&&py+pH>w.y+3; };
  function step(){
    if(S.over) return;
    S.frame++; S.t+=DT; const d=S.t/60;
    if(d>=24){S.over=true;S.won=true;return}
    P.crouch=K.d&&P.y>=GY-0.5;
    if(K.l)P.x-=140*DT; if(K.r)P.x+=140*DT; P.x=cl(P.x,10,150);
    P.vy+=1300*DT; P.y+=P.vy*DT; if(P.y>=GY){P.y=GY;P.vy=0;P.jumps=0}
    S.dashCd=Math.max(0,S.dashCd-DT); S.freezeCd=Math.max(0,S.freezeCd-DT); P.inv=Math.max(0,P.inv-DT);
    S.slow=Math.max(0,S.slow-DT); S.fast=Math.max(0,S.fast-DT); S.freeze=Math.max(0,S.freeze-DT); S.msgT=Math.max(0,S.msgT-DT);
    let speed=(150+d*9)*(1+T*0.04); if(S.slow>0)speed*=0.6; if(S.fast>0)speed*=1.35; if(S.freeze>0)speed=0;
    if(S.freeze<=0) S.spawn-=DT;
    if(S.spawn<=0){ spawnWave(d); S.spawn=Math.max(0.5,1.7-d*0.045-T*0.03)+rnd()*0.6; S.mouth=0.35; }
    S.mouth=Math.max(0,S.mouth-DT);
    S.giftT-=DT; if(S.giftT<=0){ S.gifts.push({x:W-30,y:rnd()<0.5?GY-22:GY-72,w:20,h:20}); S.giftT=10+rnd()*10; }
    const ws=S.waves; let k=0; for(let i=0;i<ws.length;i++){ const w=ws[i]; w.x-=speed*DT; if(w.x>-50) ws[k++]=w; } while(ws.length>k)ws.pop();
    const ph=P.crouch?24:44, gs=S.gifts; k=0;
    for(let i=0;i<gs.length;i++){ const g=gs[i]; g.x-=speed*DT; if(g.x<=-30) continue;
      if(P.x+3<g.x+g.w&&P.x+19>g.x&&P.y-ph<g.y+g.h&&P.y>g.y){ gift(); continue } gs[k++]=g; } while(gs.length>k)gs.pop();
    if(P.inv<=0&&!noDeath){ let hw=null; for(let i=0;i<S.waves.length;i++){ if(hit(S.waves[i])){hw=S.waves[i];break} } if(hw){ if(S.shield>0){ S.shield--; S.waves=S.waves.filter(w=>w!==hw); say("🛡️ A pajzs megvédett!"); } else { S.over=true; S.won=false; } } }
  }
  return {P,S,K,input,step,DT};
}
function simDays(S){ return Math.round(Math.min(24,S.t/60)*100)/100; }
/* a szerver ezzel ellenőrzi a beküldött futást: log = [képkocka, kód, képkocka, kód, ...] */
function replayRun(seed,T,log,maxF){
  const sim=mkSim(seed,T,false); let i=0;
  for(let f=0;f<45000;f++){
    while(i<log.length&&log[i]===sim.S.frame){ sim.input(log[i+1]); i+=2; }
    sim.step();
    if(sim.S.over) return {over:true,won:sim.S.won,days:simDays(sim.S),frames:sim.S.frame,unused:i<log.length};
  }
  return {over:false};
}

 left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>', right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>', down:'<svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>',
 bolt:'<svg viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg>',
 time:'<svg viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3v3l5 6-5 6v3M17 3v3l-5 6 5 6v3"/></svg>'
};
function stopGame(){ if(G){ cancelAnimationFrame(G.raf); removeEventListener("keydown",G.kd); removeEventListener("keyup",G.ku); G=null; } }
function pageMini(b){
  const t=tierInfo().i;
  b.innerHTML=`<div class="row" style="margin:6px 0"><span class="tag alive">${TIERS[t][1]} ${TIERS[t][0]}</span><label class="chk" style="margin:0"><input type="checkbox" id="prac"> Gyakorló mód</label></div>
  <p class="mut" style="margin:4px 0 8px"><b>1 perc játék = 1 nap.</b> Éld túl a 24 napot! Alacsony hanghullám → ugorj (▲), magas → bújj le (▼). Egyre gyorsabb és nehezebb. Telefonon a játéktéren is irányíthatsz: húzás balra/jobbra = mozgás, felfelé húzás vagy koppintás = ugrás, lefelé húzva tartva = lebújás. 🎁 = meglepetés (hasznos és csapda is lehet).</p>
  <canvas id="gc" width="360" height="240"></canvas>
  <div class="pad"><button class="gbtn" id="bl" aria-label="balra">${IC.left}</button><button class="gbtn" id="br" aria-label="jobbra">${IC.right}</button><button class="gbtn" id="bu" aria-label="ugrás">${IC.up}</button><button class="gbtn" id="bd" aria-label="lebújás">${IC.down}</button></div>
  <div class="pad2"><button class="gbtn ab" id="ba">${IC.bolt}<small>Kitörés (E)</small></button><button class="gbtn ab" id="bf">${IC.time}<small>Időlassítás (Q)</small></button></div>
  <p class="mut" style="margin:0 0 4px"><span id="gbest"></span></p><p class="mut" style="margin:0 0 6px" id="gstat"></p>
  <h3 style="margin:10px 0 0">Jelvények és képességek</h3>${medalsHtml()}<p class="mut" style="margin:0 0 8px">Koppints egy jelvényre: megtudod, miért jár, mit tud, és mennyi hiányzik hozzá. Gyakorló módban minden képességet kipróbálhatsz.</p>
  <h3>🏆 Ranglista</h3><div id="lb" class="arcade"><div class="mut">Betöltés…</div></div>`;
  const cv=$("#gc"), go=()=>startGame(cv,t,$("#prac").checked);
  $("#prac").onchange=go; go(); loadLb();
}
let sim_last_S=null;
async function submitRun(seed,T,log){
  const set=t=>{const e=$("#gstat"); if(e) e.textContent=t};
  window.__lastLog={seed,T,log};
  if(!user||!myPart){ set("Lépj be, hogy az eredményed felkerüljön a ranglistára."); return }
  const days=Math.round(simDays(sim_last_S)*100)/100;
  try{
    const ref=doc(db,"games",String(YEAR),"scores",user.uid), cur=await getDoc(ref);
    if(cur.exists()&&Number(cur.data().days)>=days){ set("A ranglistán a korábbi, jobb eredményed marad."); return }
    await setDoc(ref,{nick:myPart.nick,days,tier:T,t:serverTimestamp()});
    set(`Rögzítve ✓ ${days.toFixed(2).replace(".",",")} nap`); LB.t=0; loadLb();
  }catch(e){ set("A ranglista most nem érhető el, az eredmény nem került fel."); }
}
async function loadLb(){
  let el=$("#lb"); if(!el) return;
  if(!user){ el.innerHTML=`<div class="mut">Lépj be a ranglistához.</div>`; return }
  if(!LB.rows||Date.now()-LB.t>3*60e3){
    try{ const sn=await getDocs(query(collection(db,"games",String(YEAR),"scores"),orderBy("days","desc"),limit(10))); LB.rows=sn.docs.map(d=>({id:d.id,...d.data()})); LB.t=Date.now(); }
    catch(e){ el=$("#lb"); if(el) el.innerHTML=`<div class="mut">A ranglista most nem érhető el.</div>`; return }
  }
  el=$("#lb"); if(!el) return;
  el.innerHTML=`<div class="ah">★ HIGH SCORES ★</div>`+(LB.rows.length?LB.rows.map((r,i)=>`<div class="ar${r.id===user.uid?" me":""}"><span>${String(i+1).padStart(2,"0")}.</span><span class="an">${esc(r.nick)}</span><span>${Number(r.days).toFixed(2).replace(".",",")} nap</span><span>${TIERS[r.tier??0][1]}</span></div>`).join(""):`<div style="text-align:center">Még nincs eredmény – légy te az első!</div>`);
}
function startGame(cv,tier,practice){
  stopGame();
  const T=practice?4:tier, ctx=cv.getContext("2d"), W=360, H=240, GY=196;
  let sim, log, pend, notes, acc=0, finished=false, overAt=0, seed=0;
  const held={l:false,r:false,d:false}, CODES={l:[0,1],r:[2,3],d:[4,5]};
  const best=()=>ls.get("bestd"+YEAR,0);
  const bestEl=()=>{const e=$("#gbest");if(e)e.textContent=best()?`Saját rekord: ${best().toFixed(2).replace(".",",")} nap`:""};
  const setStat=t=>{const e=$("#gstat");if(e)e.textContent=t};
  const newRun=()=>{ seed=crypto.getRandomValues(new Uint32Array(1))[0]; sim=mkSim(seed,T,false); log=[]; pend=[]; notes=[]; finished=false; held.l=held.r=held.d=false; setStat(practice?"Gyakorló mód – nincs ranglista.":""); };
  const act=c=>{ if(sim.S.over) return; pend.push(c); log.push(sim.S.frame,c); };
  const setHeld=(n,on)=>{ if(held[n]===on) return; held[n]=on; act(CODES[n][on?0:1]); };
  const jump=()=>{ if(sim.S.over){ restart(); return } act(6); };
  const restart=()=>{ if(sim.S.over&&performance.now()-overAt>400) newRun(); };
  const onOver=()=>{
    finished=true; overAt=performance.now();
    const days=simDays(sim.S), prev=best(); if(!practice) gameXp(days);
    if(days>prev){ ls.set("bestd"+YEAR,days); bestEl(); if(!practice&&days>=0.02){ sim_last_S=sim.S; submitRun(seed,T,log); } }
    else if(!practice) setStat("Ez nem volt jobb a saját rekordodnál, így nem küldjük be.");
  };
  bestEl(); newRun();
  $("#ba")?.classList.toggle("lockd",T<2); $("#bf")?.classList.toggle("lockd",T<3);
  G={};
  const L=k=>k==="ArrowLeft"||k==="a"||k==="A", R=k=>k==="ArrowRight"||k==="d"||k==="D", D=k=>k==="ArrowDown"||k==="s"||k==="S", U=k=>k==="ArrowUp"||k==="w"||k==="W"||k===" ";
  G.kd=e=>{ const k=e.key; if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(k)) e.preventDefault(); if(e.repeat) return;
    if(L(k))setHeld("l",true); if(R(k))setHeld("r",true); if(D(k))setHeld("d",true); if(U(k))jump();
    if(k==="e"||k==="E")act(7); if(k==="q"||k==="Q")act(8); };
  G.ku=e=>{ const k=e.key; if(L(k))setHeld("l",false); if(R(k))setHeld("r",false); if(D(k))setHeld("d",false); };
  addEventListener("keydown",G.kd); addEventListener("keyup",G.ku);
  const hold=(id,n)=>{ const el=$(id); if(!el) return; const on=e=>{e.preventDefault();setHeld(n,true)}, off=e=>{e.preventDefault();setHeld(n,false)};
    el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off); el.addEventListener("pointerleave",off); el.addEventListener("pointercancel",off); };
  hold("#bl","l"); hold("#br","r"); hold("#bd","d");
  $("#bu")?.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
  $("#ba")?.addEventListener("pointerdown",e=>{e.preventDefault();act(7)});
  $("#bf")?.addEventListener("pointerdown",e=>{e.preventDefault();act(8)});
  const TG={id:null,x:0,y:0,t:0,moved:false,jumped:false};
  const relG=()=>{ setHeld("l",false); setHeld("r",false); setHeld("d",false); };
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); if(sim.S.over){ restart(); return; } if(TG.id!==null) return;
    TG.id=e.pointerId; TG.x=e.clientX; TG.y=e.clientY; TG.t=performance.now(); TG.moved=false; TG.jumped=false; try{cv.setPointerCapture(e.pointerId)}catch{} });
  cv.addEventListener("pointermove",e=>{ if(e.pointerId!==TG.id||sim.S.over) return; const dx=e.clientX-TG.x, dy=e.clientY-TG.y, TH=16;
    if(Math.abs(dx)>TH||Math.abs(dy)>TH) TG.moved=true;
    setHeld("l",dx<-TH); setHeld("r",dx>TH); setHeld("d",dy>22);
    if(dy<-26&&!TG.jumped){ TG.jumped=true; jump(); } else if(dy>-10) TG.jumped=false; });
  const endG=e=>{ if(e.pointerId!==TG.id) return; const tap=!TG.moved&&performance.now()-TG.t<350; TG.id=null; relG(); if(tap&&!sim.S.over) jump(); };
  cv.addEventListener("pointerup",endG); cv.addEventListener("pointercancel",endG);
  let last=performance.now();
  function frame(now){
    const dtm=Math.min(0.1,(now-last)/1000); last=now; acc+=dtm;
    const S=sim.S, P=sim.P, DT=sim.DT;
    let n=0;
    while(acc>=DT&&n<6){ acc-=DT; n++;
      if(!S.over){ P.px=P.x; P.py=P.y; for(const w of S.waves)w.px=w.x; for(const g of S.gifts)g.px=g.x;
        while(pend.length) sim.input(pend.shift());
        sim.step(); if(S.over&&!finished) onOver(); } }
    if(acc>DT*2) acc=0;
    const al=S.over?1:acc/DT, ip=(c,p)=>p===undefined?c:p+(c-p)*al;
    if(!S.over&&Math.random()<dtm*2) notes.push({x:W-30,y:60+Math.random()*60,v:20+Math.random()*30});
    for(const nt of notes){nt.y-=nt.v*dtm;nt.x+=6*dtm} notes=notes.filter(nt=>nt.y>10);
    // rajz
    const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#cfe6f7"); sky.addColorStop(1,"#f4faff"); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff"; ctx.fillRect(0,GY,W,H-GY); ctx.fillStyle="#bcd9ee"; ctx.fillRect(0,GY,W,2);
    ctx.fillStyle="rgba(140,195,234,.55)"; for(let i=0;i<14;i++){ctx.beginPath();ctx.arc((i*97+S.t*20)%W,(i*53)%GY,1.6,0,6.3);ctx.fill()}
    notes.forEach(nt=>{ctx.fillStyle="rgba(215,38,61,.55)";ctx.font="14px sans-serif";ctx.fillText("♪",nt.x,nt.y)});
    drawMariah(ctx,318,GY,S.mouth>0);
    S.waves.forEach(w=>drawWave(ctx,{...w,x:ip(w.x,w.px)}));
    S.gifts.forEach(g=>{ cIco(ctx,"gift",ip(g.x,g.px),g.y-2,22,"#e0932b",2); });
    const hx=ip(P.x,P.px), hy=ip(P.y,P.py);
    if(P.inv>0) ctx.globalAlpha=.5;
    drawHero(ctx,{x:hx,y:hy,crouch:P.crouch}); ctx.globalAlpha=1;
    if(S.shield>0){ ctx.strokeStyle="rgba(44,111,168,.8)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hx+11,hy-(P.crouch?12:22),26,0,6.3); ctx.stroke(); }
    if(S.freeze>0){ ctx.fillStyle="rgba(120,180,255,.22)"; ctx.fillRect(0,0,W,H); }
    const dd=Math.min(24,S.t/60);
    ctx.fillStyle="#16324f"; ctx.font="700 13px system-ui,sans-serif"; ctx.textAlign="left"; ctx.fillText(`Nap ${dd.toFixed(1).replace(".",",")} / 24`,10,18);
    ctx.fillStyle="rgba(22,50,79,.15)"; ctx.fillRect(10,24,150,5); ctx.fillStyle="#d7263d"; ctx.fillRect(10,24,150*dd/24,5);
    ctx.font="12px system-ui,sans-serif"; ctx.textAlign="right";
    { let hx2=W-10; const put=(icon,txt,col)=>{ const w=ctx.measureText(txt).width; ctx.fillStyle=col; ctx.fillText(txt,hx2,18); cIco(ctx,icon,hx2-w-17,4,15,col,2.2); hx2-=w+28; };
      if(T>=3) put("timer",S.freezeCd>0?String(Math.ceil(S.freezeCd)):"kész",S.freezeCd>0?"#6b86a0":"#2a9d6f");
      if(T>=2) put("bolt",S.dashCd>0?String(Math.ceil(S.dashCd)):"kész",S.dashCd>0?"#6b86a0":"#2a9d6f");
      if(S.shield>0) put("shield","×"+S.shield,"#2c6fa8"); ctx.textAlign="left"; }
    if(S.msgT>0){ ctx.fillStyle="rgba(22,50,79,.85)"; ctx.font="700 14px system-ui,sans-serif"; ctx.textAlign="center"; ctx.fillText(S.msg,W/2,60); ctx.textAlign="left"; }
    if(S.over){ ctx.fillStyle="rgba(22,50,79,.78)"; ctx.fillRect(15,70,330,100); ctx.fillStyle="#fff"; ctx.textAlign="center";
      ctx.font="700 18px system-ui,sans-serif"; ctx.fillText(S.won?"TÚLÉLTED KARÁCSONYIG!":"Felismerted a dalt!",W/2,106); cIco(ctx,S.won?"tree":"skull",W/2-11,72,22,"#fff",2);
      ctx.font="14px system-ui,sans-serif"; ctx.fillText(`${simDays(S).toFixed(2).replace(".",",")} napot bírtál${practice?" (gyakorló)":""}`,W/2,126); ctx.fillText("Koppints vagy nyomd meg a ▲ gombot az újrához",W/2,150); ctx.textAlign="left"; }
    G.raf=requestAnimationFrame(frame);
  }
  G.raf=requestAnimationFrame(frame);
}
function drawHero(ctx,P){
  const h=P.crouch?24:44, x=P.x, y=P.y;
  ctx.fillStyle="#2c6fa8"; ctx.fillRect(x+2,y-h+14,18,h-14);
  ctx.fillStyle="#f1cfb3"; ctx.beginPath(); ctx.arc(x+11,y-h+8,8,0,6.3); ctx.fill();
  ctx.strokeStyle="#16324f"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x+11,y-h+8,10,Math.PI,0); ctx.stroke();
  ctx.fillStyle="#d7263d"; ctx.fillRect(x-1,y-h+4,5,9); ctx.fillRect(x+18,y-h+4,5,9);
  ctx.fillStyle="#16324f"; ctx.fillRect(x+4,y-6,5,6); ctx.fillRect(x+13,y-6,5,6);
}
function drawMariah(ctx,x,GY,open){
  ctx.fillStyle="#d7263d"; ctx.beginPath(); ctx.moveTo(x,GY-70); ctx.lineTo(x-22,GY); ctx.lineTo(x+22,GY); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillRect(x-12,GY-72,24,5);
  ctx.fillStyle="#f1cfb3"; ctx.beginPath(); ctx.arc(x,GY-82,10,0,6.3); ctx.fill();
  ctx.fillStyle="#d1a85f"; ctx.beginPath(); ctx.arc(x,GY-86,11,Math.PI,0); ctx.fill();
  ctx.fillStyle="#d7263d"; ctx.beginPath(); ctx.moveTo(x-10,GY-90); ctx.lineTo(x+4,GY-106); ctx.lineTo(x+12,GY-90); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x+4,GY-107,3,0,6.3); ctx.fill();
  ctx.fillStyle=open?"#7a1d1d":"#c4554f"; ctx.beginPath(); ctx.ellipse(x-3,GY-78,open?4:3,open?4:1.5,0,0,6.3); ctx.fill();
  ctx.strokeStyle="#f1cfb3"; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x-12,GY-58); ctx.lineTo(x-26,GY-66); ctx.stroke();
  ctx.fillStyle="#333"; ctx.beginPath(); ctx.arc(x-28,GY-67,3.5,0,6.3); ctx.fill();
}
function drawWave(ctx,w){
  const cy=w.y+w.h/2;
  ctx.save(); ctx.strokeStyle="#d7263d"; ctx.lineWidth=3; ctx.lineCap="round";
  for(let i=0;i<3;i++){ ctx.globalAlpha=1-i*0.25; ctx.beginPath(); ctx.arc(w.x+w.w-6-i*6,cy,w.h/2-2+i*5,Math.PI*0.62,Math.PI*1.38); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle="#16324f"; ctx.font="bold 15px sans-serif"; ctx.textAlign="center"; ctx.fillText(w.type==="low"?"♫":"♪",w.x+w.w/2-2,cy+5); ctx.textAlign="left";
}
